<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اكتشفي المستشعرات — من أنا؟</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0e1a;
  --gyro:#8B5CF6;    --gyro-l:#EDE9FE;
  --color:#EC4899;   --color-l:#FCE7F3;
  --dist:#06B6D4;    --dist-l:#CFFAFE;
  --force:#F59E0B;   --force-l:#FEF3C7;
  --green:#10B981;   --red:#EF4444;
  --card:#131929;    --card2:#1a2236;
  --text:#F1F5F9;    --muted:#94A3B8;
  --glow:0 0 30px rgba(139,92,246,.5);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Tajawal',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}

/* ── ANIMATED STARS BG ── */
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;
  background:
    radial-gradient(ellipse at 20% 20%,rgba(139,92,246,.12) 0%,transparent 50%),
    radial-gradient(ellipse at 80% 80%,rgba(6,182,212,.12) 0%,transparent 50%),
    radial-gradient(ellipse at 50% 50%,rgba(16,185,129,.06) 0%,transparent 60%);
  z-index:0;
}

/* ── HEADER ── */
.header{
  background:linear-gradient(135deg,#1a1040,#0e1a30);
  border-bottom:1px solid rgba(139,92,246,.3);
  padding:12px 22px;display:flex;justify-content:space-between;align-items:center;
  position:relative;z-index:10;
  box-shadow:0 4px 20px rgba(0,0,0,.4);
}
.header h1{
  font-size:1.15em;font-weight:900;
  background:linear-gradient(90deg,#a78bfa,#38bdf8,#34d399);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent
}
.hright{display:flex;gap:10px;align-items:center}
.hbadge{
  background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.15);
  border-radius:12px;padding:5px 14px;color:#fff;font-weight:900;font-size:.92em
}
.timer-b{min-width:64px;text-align:center;font-size:1.08em}
.timer-b.urgent{background:rgba(239,68,68,.35)!important;border-color:#ef4444!important;animation:pulse .9s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}

/* PROGRESS DOTS */
.prog-dots{display:flex;gap:6px;align-items:center;padding:10px 22px;position:relative;z-index:10;justify-content:center}
.pdot{width:32px;height:8px;border-radius:4px;background:rgba(255,255,255,.12);transition:.4s}
.pdot.active{background:linear-gradient(90deg,#8B5CF6,#38bdf8)}
.pdot.done{background:var(--green)}

/* VIEWS */
.view{display:none;position:relative;z-index:1}.view.active{display:block}

/* ── NAME SCREEN ── */
.center-wrap{max-width:520px;margin:50px auto;padding:20px;text-align:center}
.name-card{
  background:linear-gradient(135deg,#1a1040,#0e1a30);
  border-radius:28px;padding:44px 32px;
  border:1.5px solid rgba(139,92,246,.35);
  box-shadow:var(--glow),0 16px 40px rgba(0,0,0,.4);
}
.nc-icon{font-size:6em;display:block;margin-bottom:14px;animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.name-card h2{font-size:1.75em;font-weight:900;margin-bottom:6px;
  background:linear-gradient(90deg,#a78bfa,#38bdf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.name-card p{color:var(--muted);font-size:1em;margin-bottom:24px;line-height:1.65}
.name-sel{
  width:100%;padding:13px 16px;background:#0a0e1a;
  border:1.5px solid rgba(139,92,246,.4);border-radius:14px;
  color:#fff;font-family:'Tajawal',sans-serif;font-size:1.05em;
  margin-bottom:18px;cursor:pointer;appearance:none;
  transition:border-color .2s
}
.name-sel:focus{outline:none;border-color:#8B5CF6}
.name-sel option{background:#1a1040}
.go-btn{
  width:100%;padding:15px;border:none;border-radius:14px;
  background:linear-gradient(135deg,#8B5CF6,#06B6D4);
  color:#fff;font-family:'Tajawal',sans-serif;font-size:1.15em;font-weight:900;
  cursor:pointer;box-shadow:0 6px 20px rgba(139,92,246,.45);
  transition:transform .2s,box-shadow .2s
}
.go-btn:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(139,92,246,.55)}

/* ── DISCOVERY SCREEN ── */
.disc-wrap{max-width:760px;margin:0 auto;padding:14px 16px 30px}

/* SENSOR MYSTERY CARD */
.mystery-card{
  background:var(--card);border-radius:24px;padding:0;
  border:1.5px solid rgba(255,255,255,.1);
  box-shadow:0 8px 32px rgba(0,0,0,.35);
  margin-bottom:18px;overflow:hidden;
  animation:popIn .5s cubic-bezier(.36,1.56,.64,1)
}
@keyframes popIn{from{transform:scale(.88);opacity:0}to{transform:scale(1);opacity:1}}

.mystery-visual{
  height:180px;display:flex;align-items:center;justify-content:center;
  font-size:7.5em;position:relative;overflow:hidden
}
.mystery-visual .big-q{
  position:absolute;font-size:6em;color:rgba(255,255,255,.06);font-weight:900;
  letter-spacing:-20px;user-select:none;animation:rotate 8s linear infinite
}
@keyframes rotate{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.mystery-visual .sensor-emoji{
  position:relative;z-index:2;
  filter:drop-shadow(0 8px 20px rgba(0,0,0,.4));
  animation:float 3s ease-in-out infinite
}
/* CLUE SYSTEM */
.clues-area{padding:18px 22px 22px}
.clue-label{font-size:.8em;font-weight:800;color:var(--muted);margin-bottom:10px;letter-spacing:.5px;text-transform:uppercase}
.clue-row{display:flex;flex-direction:column;gap:8px}
.clue-item{
  background:var(--card2);border-radius:12px;padding:11px 16px;
  display:flex;align-items:center;gap:10px;
  border:1.5px solid rgba(255,255,255,.07);
  animation:slideIn .4s ease forwards
}
@keyframes slideIn{from{transform:translateX(16px);opacity:0}to{transform:translateX(0);opacity:1}}
.clue-item .ci-num{
  width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:.8em;font-weight:900;flex-shrink:0;color:#fff
}
.clue-item .ci-text{font-size:.97em;font-weight:700;color:var(--text);line-height:1.5}

/* REVEAL MORE BTN */
.reveal-btn{
  margin:10px 22px 0;padding:9px 18px;border:1.5px solid rgba(255,255,255,.15);
  border-radius:11px;background:rgba(255,255,255,.06);color:var(--muted);
  font-family:'Tajawal',sans-serif;font-size:.9em;font-weight:700;cursor:pointer;
  transition:.2s;display:block;width:calc(100% - 44px);text-align:center;margin-bottom:18px
}
.reveal-btn:hover{background:rgba(255,255,255,.12);color:#fff}
.reveal-btn:disabled{display:none}

/* ANSWER OPTIONS */
.options-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:8px}
.opt-btn{
  border-radius:18px;padding:18px 12px;border:2.5px solid transparent;
  font-family:'Tajawal',sans-serif;font-size:1em;font-weight:900;
  cursor:pointer;transition:all .22s cubic-bezier(.36,1.56,.64,1);
  display:flex;flex-direction:column;align-items:center;gap:8px;
  background:var(--card2);color:var(--text);
}
.opt-btn:hover{transform:translateY(-3px) scale(1.03);border-color:rgba(255,255,255,.25);background:rgba(255,255,255,.08)}
.opt-btn:disabled{cursor:not-allowed}
.opt-btn .ob-emoji{font-size:2.2em}
.opt-btn .ob-ar{font-size:1em;font-weight:900}
.opt-btn .ob-en{font-size:.78em;color:var(--muted);font-weight:700}

/* CORRECT/WRONG STATES */
.opt-btn.correct{background:rgba(16,185,129,.2)!important;border-color:var(--green)!important;color:#fff!important;animation:correctPop .4s cubic-bezier(.36,1.56,.64,1)}
.opt-btn.wrong{background:rgba(239,68,68,.15)!important;border-color:#ef4444!important;opacity:.7}
@keyframes correctPop{0%{transform:scale(1)}50%{transform:scale(1.1)}100%{transform:scale(1.05)}}

/* FEEDBACK */
.feedback{
  border-radius:16px;padding:14px 18px;margin-bottom:12px;
  text-align:center;display:none;animation:slideUp .35s ease
}
@keyframes slideUp{from{transform:translateY(12px);opacity:0}to{transform:translateY(0);opacity:1}}
.feedback.show{display:block}
.feedback.ok{background:rgba(16,185,129,.15);border:2px solid var(--green)}
.feedback.err{background:rgba(239,68,68,.12);border:2px solid #ef4444}
.fb-icon{font-size:2em;margin-bottom:5px}
.fb-title{font-size:1.05em;font-weight:900;margin-bottom:3px}
.fb-desc{font-size:.9em;color:var(--muted);line-height:1.5}

.next-btn{
  width:100%;padding:14px;border:none;border-radius:14px;
  background:linear-gradient(135deg,#8B5CF6,#06B6D4);
  color:#fff;font-family:'Tajawal',sans-serif;font-size:1.1em;font-weight:900;
  cursor:pointer;display:none;animation:slideUp .3s ease;
  box-shadow:0 5px 18px rgba(139,92,246,.35);transition:transform .2s
}
.next-btn:hover{transform:translateY(-2px)}

/* SCORE SPARKLE */
.sparkle{
  position:fixed;pointer-events:none;z-index:9999;
  font-size:1.4em;animation:sparkleAnim 1s ease forwards
}
@keyframes sparkleAnim{0%{transform:translateY(0) scale(1);opacity:1}100%{transform:translateY(-80px) scale(1.5);opacity:0}}

/* ── FINAL SCREEN ── */
.final-wrap{max-width:640px;margin:36px auto;padding:20px;text-align:center}
.final-card{
  background:linear-gradient(135deg,#1a1040,#0e1a30);
  border-radius:30px;padding:46px 32px;
  border:1.5px solid rgba(139,92,246,.4);
  box-shadow:var(--glow),0 16px 40px rgba(0,0,0,.4);
}
.fc-trophy{font-size:5em;display:block;margin-bottom:14px;animation:float 2s ease-in-out infinite}
.final-card h2{font-size:1.9em;font-weight:900;margin-bottom:6px;
  background:linear-gradient(90deg,#a78bfa,#38bdf8,#34d399);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.score-pill{
  display:inline-block;
  background:linear-gradient(135deg,#8B5CF6,#06B6D4);
  color:#fff;border-radius:50px;padding:10px 32px;
  font-size:1.5em;font-weight:900;margin:14px 0;
  box-shadow:0 6px 20px rgba(139,92,246,.4)
}
/* SENSORS SUMMARY */
.sensors-summary{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px}
.ss-card{border-radius:18px;padding:16px 14px;text-align:center}
.ss-card .ss-emoji{font-size:2.8em;display:block;margin-bottom:8px}
.ss-card .ss-ar{font-size:.95em;font-weight:900}
.ss-card .ss-en{font-size:.78em;margin-top:3px;opacity:.7;font-weight:700}
.ss-card .ss-desc{font-size:.78em;margin-top:6px;opacity:.75;line-height:1.5}

/* CONFETTI */
.conf{position:fixed;border-radius:3px;pointer-events:none;z-index:9999;animation:fall 2s linear forwards}
@keyframes fall{0%{transform:translateY(-20px) rotate(0);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}
</style>
</head>
<body>

<!-- HEADER -->
<div class="header" id="mainHdr">
  <h1>🔬 اكتشفي المستشعرات — مَن أنا؟</h1>
  <div class="hright">
    <div class="hbadge" id="scoreBadge">⭐ 0</div>
    <div class="hbadge timer-b" id="timerBadge" style="display:none">30</div>
  </div>
</div>
<!-- PROGRESS DOTS -->
<div class="prog-dots">
  <div class="pdot" id="pd0"></div>
  <div class="pdot" id="pd1"></div>
  <div class="pdot" id="pd2"></div>
  <div class="pdot" id="pd3"></div>
</div>

<!-- NAME SCREEN -->
<div class="view active" id="nameView">
  <div class="center-wrap">
    <div class="name-card">
      <span class="nc-icon">🔍</span>
      <h2>مَن أنا؟</h2>
      <p>اقرئي الأدلة واكتشفي اسم كل مستشعر!<br>كلما خمّنتِ بسرعة حصلتِ على نقاط أكثر ✨</p>
      <select id="nameSelect" class="name-sel">
        <option value="">— اختاري اسمكِ —</option>
        <option>أريام حميد الحبيني</option>
        <option>اسيل موسى العوض</option>

        <option>امامه سليم علبي</option>
        <option>امنه هياب احمد عبدالرحمن</option>

        <option>رنيم حسني عواد الخلايله</option>
        <option>روقيه شعبان محمد هنداوي حسانين</option>
        <option>رؤى بوكيوض</option>
        <option>ريان محمود الحاج أمين نجار</option>
        <option>ريتال حسني عواد الخلايله</option>
        <option>شما عمر بشير عبدالقادر</option>
        <option>فاطمه فخر الدين احمد الامين</option>
        <option>قمر حازم عمر</option>
        <option>ليا عبد الحاج اسماعيل</option>
        <option>ماريا عبدالعليم الرزوق</option>
        <option>مريم حافظ فاروق احمد احمد</option>
        <option>ملاك عبدالله الدرويش</option>
        <option>نداء حسين المحمد العبادي</option>
        <option>نور أيهاب عبدالحميد عبدالسلام غمري</option>
        <option>نورا عبدالعزيز عبدالله محمد المنصورى</option>
        <option>نيللي أمير سعيد محمود الحداد</option>
        <option>هنادي محمد عبدالله علي هيلان</option>
        <option>وعد مصطفى أحمد عثمان</option>
      </select>
      <button class="go-btn" id="goBtn">ابدئي الاكتشاف 🔍</button>
    </div>
  </div>
</div>

<!-- DISCOVERY SCREEN -->
<div class="view" id="discView">
  <div class="disc-wrap">
    <!-- MYSTERY CARD -->
    <div class="mystery-card" id="mysteryCard">
      <div class="mystery-visual" id="mysteryVisual">
        <div class="big-q">؟؟؟</div>
        <span class="sensor-emoji" id="sensorEmoji"></span>
      </div>
      <div class="clues-area">
        <div class="clue-label">🕵️ الأدلة</div>
        <div class="clue-row" id="clueRow"></div>
      </div>
      <button class="reveal-btn" id="revealBtn">👁️ اكشفي دليلاً إضافياً</button>
    </div>

    <!-- OPTIONS -->
    <div class="options-grid" id="optionsGrid"></div>

    <!-- FEEDBACK -->
    <div class="feedback" id="feedback">
      <div class="fb-icon" id="fbIcon"></div>
      <div class="fb-title" id="fbTitle"></div>
      <div class="fb-desc" id="fbDesc"></div>
    </div>
    <button class="next-btn" id="nextBtn"></button>
  </div>
</div>

<!-- FINAL SCREEN -->
<div class="view" id="finalView">
  <div class="final-wrap">
    <div class="final-card">
      <span class="fc-trophy">🏆</span>
      <h2 id="finalName"></h2>
      <p style="color:var(--muted);font-size:1em;margin-bottom:4px">نتيجتكِ</p>
      <div class="score-pill" id="finalScore"></div>
      <div class="sensors-summary" id="sensorsSummary"></div>
    </div>
  </div>
</div>

<script>
const DB   = 'https://cyber-safety-class-default-rtdb.firebaseio.com';
const PATH = 'robots-lesson/sensors-discovery';

/* ══════════════════════════════════════
   SENSORS DATA
══════════════════════════════════════ */
const SENSORS = [
  {
    id:'gyro',
    emoji:'🌀',
    ar:'مستشعر الدوران',
    en:'Built in Gyro Sensor',
    color:'#8B5CF6',
    bg:'linear-gradient(135deg,#2d1b69,#1e0f4a)',
    clues:[
      'أنا مخفيٌّ داخل وحدة التحكم Hub ولا أحتاج إلى توصيل!',
      'أشعر بكل حركة دوران للروبوت يميناً أو يساراً وأقيس زاويتها.',
      'بفضلي يستطيع الروبوت أن يعرف اتجاهه ويتحرك باستقامة.',
    ],
    feedback:'مستشعر الدوران 🌀 مدمج داخل وحدة التحكم Hub ويقيس زاوية دوران الروبوت!',
  },
  {
    id:'color',
    emoji:'🎨',
    ar:'مستشعر الألوان',
    en:'Color Sensor',
    color:'#EC4899',
    bg:'linear-gradient(135deg,#831843,#4a0626)',
    clues:[
      'عيناي ترى الألوان! أستطيع التمييز بين الأحمر والأخضر والأزرق وغيرها.',
      'أُستخدم لجعل الروبوت يتوقف عند خط معين أو يتتبع مساراً ملوناً.',
      'يمكنني أيضاً قياس شدة الضوء في البيئة المحيطة.',
    ],
    feedback:'مستشعر الألوان 🎨 يرى ويميّز الألوان المختلفة ويتتبع الخطوط الملونة!',
  },
  {
    id:'dist',
    emoji:'📏',
    ar:'مستشعر المسافة',
    en:'Distance Sensor',
    color:'#06B6D4',
    bg:'linear-gradient(135deg,#0c4a6e,#0a2440)',
    clues:[
      'أُرسل موجات وأنتظر رجوعها لأعرف كم أنا بعيد عن الأشياء.',
      'بفضلي لا يصطدم الروبوت بالجدران والعقبات أمامه.',
      'أستطيع قياس المسافة بدقة عالية بين الروبوت وأي جسم أمامه.',
    ],
    feedback:'مستشعر المسافة 📏 يقيس البعد بين الروبوت والأجسام ويمنع الاصطدام!',
  },
  {
    id:'force',
    emoji:'✊',
    ar:'مستشعر القوة',
    en:'Force Sensor',
    color:'#F59E0B',
    bg:'linear-gradient(135deg,#78350f,#3d1c07)',
    clues:[
      'أشعر بالضغط! عندما تضغط علي أُرسل إشارة للروبوت.',
      'يمكنني التمييز بين الضغط الخفيف والضغط الشديد بدقة.',
      'أُستخدم كزر أو مفتاح يُشغّل الروبوت أو يوقفه عند اللمس.',
    ],
    feedback:'مستشعر القوة ✊ يكشف اللمس والضغط ويقيس قوته بدقة!',
  },
];

/* OPTIONS (all 4 shown each round) */
const ALL_OPTS = SENSORS.map(s=>({id:s.id,emoji:s.emoji,ar:s.ar,en:s.en,color:s.color}));

function shuffle(a){return [...a].sort(()=>Math.random()-.5)}

let student='', score=0, round=0, answered=false, clueShown=0;
let timerInt=null, timerSec=30;
let results=[];
const SHUFFLED = shuffle([0,1,2,3]); // order of sensors

/* ─── START ─── */
document.getElementById('goBtn').addEventListener('click',()=>{
  student=document.getElementById('nameSelect').value;
  if(!student){alert('اختاري اسمكِ أولاً!');return;}
  showView('discView');
  loadRound(0);
});

function showView(id){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

/* ─── LOAD ROUND ─── */
function loadRound(r){
  round=r; answered=false; clueShown=0;
  const sensor=SENSORS[SHUFFLED[r]];

  // Progress dots
  for(let i=0;i<4;i++){
    const d=document.getElementById('pd'+i);
    d.className='pdot'+(i<r?' done':i===r?' active':'');
  }

  // Visual
  const vis=document.getElementById('mysteryVisual');
  vis.style.background=sensor.bg;
  document.getElementById('sensorEmoji').textContent='❓';

  // Show first clue
  document.getElementById('clueRow').innerHTML='';
  showClue(sensor,0);

  // Reveal button
  const revBtn=document.getElementById('revealBtn');
  revBtn.disabled=false;
  revBtn.style.display='block';
  revBtn.textContent='👁️ اكشفي دليلاً إضافياً ('+(sensor.clues.length-1)+' متبقٍ)';

  // Options (shuffled)
  renderOptions(sensor);

  // Feedback + next
  document.getElementById('feedback').className='feedback';
  document.getElementById('nextBtn').style.display='none';

  // Timer
  document.getElementById('timerBadge').style.display='flex';
  startTimer();
}

/* ─── CLUES ─── */
function showClue(sensor, idx){
  clueShown=idx+1;
  const row=document.getElementById('clueRow');
  const colors=['#8B5CF6','#06B6D4','#10B981'];
  const div=document.createElement('div');
  div.className='clue-item';
  div.style.animationDelay=(idx*0.1)+'s';
  div.innerHTML=`<div class="ci-num" style="background:${colors[idx]||'#666'}">${idx+1}</div>
    <div class="ci-text">${sensor.clues[idx]}</div>`;
  row.appendChild(div);

  const revBtn=document.getElementById('revealBtn');
  if(clueShown>=sensor.clues.length){revBtn.disabled=true;revBtn.style.display='none';}
  else revBtn.textContent='👁️ اكشفي دليلاً إضافياً ('+(sensor.clues.length-clueShown)+' متبقٍ)';
}

document.getElementById('revealBtn').addEventListener('click',()=>{
  const sensor=SENSORS[SHUFFLED[round]];
  if(clueShown<sensor.clues.length) showClue(sensor,clueShown);
});

/* ─── OPTIONS ─── */
function renderOptions(sensor){
  const grid=document.getElementById('optionsGrid');
  grid.innerHTML='';
  shuffle(ALL_OPTS).forEach(opt=>{
    const btn=document.createElement('button');
    btn.className='opt-btn';
    btn.id='opt-'+opt.id;
    btn.innerHTML=`<span class="ob-emoji">${opt.emoji}</span>
      <span class="ob-ar">${opt.ar}</span>
      <span class="ob-en">${opt.en}</span>`;
    btn.style.borderColor='rgba(255,255,255,.08)';
    btn.addEventListener('click',()=>chooseAnswer(opt.id, sensor));
    grid.appendChild(btn);
  });
}

/* ─── ANSWER ─── */
function chooseAnswer(chosen, sensor){
  if(answered)return;
  answered=true;
  clearInterval(timerInt);
  document.getElementById('timerBadge').style.display='none';

  const isOk=(chosen===sensor.id);
  // Points: more if fewer clues used and faster
  const pts=isOk ? Math.max(5, 20-((clueShown-1)*5) + Math.floor(timerSec/5)) : 0;
  if(isOk){score+=pts; spawnStars(pts);}
  document.getElementById('scoreBadge').textContent='⭐ '+score;
  results.push({sensor:sensor.id,correct:isOk,pts,cluesUsed:clueShown});

  // Reveal sensor emoji
  document.getElementById('sensorEmoji').textContent=sensor.emoji;

  // Style buttons
  document.querySelectorAll('.opt-btn').forEach(b=>{
    b.disabled=true;
    const bid=b.id.replace('opt-','');
    if(bid===sensor.id) b.classList.add('correct');
    else if(bid===chosen&&!isOk) b.classList.add('wrong');
  });

  // Feedback
  const fb=document.getElementById('feedback');
  document.getElementById('fbIcon').textContent=isOk?'🎉':'💡';
  document.getElementById('fbTitle').textContent=isOk?`ممتاز! +${pts} نقطة 🌟`:'إجابة خاطئة — لكن تعلّمنا!';
  document.getElementById('fbDesc').textContent=sensor.feedback;
  fb.className='feedback show '+(isOk?'ok':'err');

  // Next
  const nb=document.getElementById('nextBtn');
  nb.style.display='block';
  nb.textContent=round<3?'المستشعر التالي ←':'أرى نتيجتي 🏆';
  if(isOk) spawnConfetti(12);
}

/* ─── NEXT BTN ─── */
document.getElementById('nextBtn').addEventListener('click',()=>{
  if(round<3) loadRound(round+1);
  else finish();
});

/* ─── TIMER ─── */
function startTimer(){
  clearInterval(timerInt);
  timerSec=30;updateTimer();
  timerInt=setInterval(()=>{
    timerSec--;updateTimer();
    if(timerSec<=0){clearInterval(timerInt);
      if(!answered) chooseAnswer('__none__',SENSORS[SHUFFLED[round]]);}
  },1000);
}
function updateTimer(){
  const el=document.getElementById('timerBadge');
  el.textContent=String(timerSec).padStart(2,'0');
  el.className='hbadge timer-b'+(timerSec<=10?' urgent':'');
}

/* ─── FINISH ─── */
async function finish(){
  clearInterval(timerInt);
  const key=encodeURIComponent(student.replace(/\s+/g,'_'));
  const data={name:student,score,results,timestamp:Date.now()};
  try{
    await fetch(`${DB}/${PATH}/${key}.json`,{method:'PUT',body:JSON.stringify(data)});
    await fetch(`${DB}/robots-lesson/scores/${key}/sensors.json`,{method:'PUT',body:JSON.stringify(score)});
    await fetch(`${DB}/robots-lesson/scores/${key}/name.json`,{method:'PUT',body:JSON.stringify(student)});
  }catch(e){}

  // Progress dots - all done
  for(let i=0;i<4;i++) document.getElementById('pd'+i).className='pdot done';

  showView('finalView');
  document.getElementById('finalName').textContent='أحسنتِ، '+student+'! 🌟';
  document.getElementById('finalScore').textContent='⭐ '+score+' / 80+ نقطة';

  // Summary
  const COLORS_BG={gyro:'background:rgba(139,92,246,.2)',color:'background:rgba(236,72,153,.2)',dist:'background:rgba(6,182,212,.2)',force:'background:rgba(245,158,11,.2)'};
  document.getElementById('sensorsSummary').innerHTML=SENSORS.map(s=>`
    <div class="ss-card" style="${COLORS_BG[s.id]};border:1.5px solid ${s.color}55">
      <span class="ss-emoji">${s.emoji}</span>
      <div class="ss-ar">${s.ar}</div>
      <div class="ss-en">${s.en}</div>
      <div class="ss-desc">${s.feedback}</div>
    </div>`).join('');

  spawnConfetti(40);
}

/* ─── EFFECTS ─── */
function spawnStars(pts){
  for(let i=0;i<5;i++) setTimeout(()=>{
    const el=document.createElement('div');
    el.className='sparkle';
    el.textContent=['⭐','✨','🌟'][Math.floor(Math.random()*3)];
    el.style.cssText=`left:${20+Math.random()*60}vw;top:${30+Math.random()*30}vh;animation-delay:${i*.1}s`;
    document.body.appendChild(el);setTimeout(()=>el.remove(),1200);
  },i*100);
}
function spawnConfetti(n=15){
  const cols=['#8B5CF6','#EC4899','#06B6D4','#F59E0B','#10B981','#a78bfa'];
  for(let i=0;i<n;i++) setTimeout(()=>{
    const el=document.createElement('div');el.className='conf';
    el.style.cssText=`left:${Math.random()*100}vw;top:-10px;
      background:${cols[Math.floor(Math.random()*cols.length)]};
      width:${6+Math.random()*8}px;height:${6+Math.random()*8}px;
      border-radius:${Math.random()>.5?'50%':'3px'};
      animation-duration:${1.4+Math.random()*1.3}s;animation-delay:${Math.random()*.5}s`;
    document.body.appendChild(el);setTimeout(()=>el.remove(),3000);
  },i*55);
}
</script>
