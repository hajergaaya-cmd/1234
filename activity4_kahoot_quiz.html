<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نشاط 4: اختبار كاهوت التفاعلي</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 25px;
            padding: 40px;
            max-width: 800px;
            width: 100%;
            box-shadow: 0 25px 70px rgba(0,0,0,0.4);
        }

        .welcome-screen, .question-screen, .result-screen {
            display: none;
            text-align: center;
        }

        .welcome-screen.active, .question-screen.active, .result-screen.active {
            display: block;
        }

        h1 {
            font-size: 3em;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
        }

        .subtitle {
            color: #666;
            font-size: 1.3em;
            margin-bottom: 30px;
        }

        .start-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 20px 50px;
            font-size: 1.5em;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        .start-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.6);
        }

        .question-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 30px;
        }

        .question-number {
            font-size: 1.2em;
            opacity: 0.9;
            margin-bottom: 10px;
        }

        .question-text {
            font-size: 1.8em;
            font-weight: bold;
        }

        .timer {
            background: #ff6b6b;
            color: white;
            padding: 15px 30px;
            border-radius: 50px;
            font-size: 2em;
            font-weight: bold;
            margin: 20px auto;
            width: fit-content;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 30px;
        }

        .option {
            padding: 30px;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1.3em;
            font-weight: bold;
            color: white;
            position: relative;
            overflow: hidden;
        }

        .option::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255,255,255,0.2);
            transform: translateX(-100%);
            transition: transform 0.3s;
        }

        .option:hover::before {
            transform: translateX(0);
        }

        .option.red { background: #e74c3c; }
        .option.blue { background: #3498db; }
        .option.yellow { background: #f39c12; }
        .option.green { background: #2ecc71; }

        .option:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .option.selected {
            transform: scale(0.95);
            opacity: 0.7;
        }

        .option.correct {
            animation: correctAnim 0.6s;
        }

        .option.wrong {
            animation: wrongAnim 0.6s;
        }

        @keyframes correctAnim {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); background: #27ae60; }
        }

        @keyframes wrongAnim {
            0%, 100% { transform: scale(1); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .feedback {
            margin-top: 30px;
            padding: 25px;
            border-radius: 15px;
            font-size: 1.4em;
            font-weight: bold;
            display: none;
        }

        .feedback.show {
            display: block;
            animation: slideUp 0.5s;
        }

        @keyframes slideUp {
            from {
                transform: translateY(30px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .feedback.correct {
            background: #d4edda;
            color: #155724;
        }

        .feedback.wrong {
            background: #f8d7da;
            color: #721c24;
        }

        .next-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2em;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 20px;
            font-weight: bold;
            display: none;
        }

        .next-btn.show {
            display: inline-block;
        }

        .next-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        .score-board {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            padding: 40px;
            border-radius: 20px;
            margin: 30px 0;
        }

        .final-score {
            font-size: 5em;
            font-weight: bold;
            margin: 20px 0;
        }

        .medal {
            font-size: 6em;
            margin: 20px 0;
        }

        .leaderboard {
            background: #f8f9ff;
            padding: 25px;
            border-radius: 15px;
            margin-top: 30px;
        }

        .leaderboard h3 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.5em;
        }

        .rank-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background: white;
            border-radius: 10px;
            margin-bottom: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .rank-number {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.2em;
        }

        .rank-name {
            flex: 1;
            margin: 0 15px;
            font-weight: bold;
        }

        .rank-score {
            color: #667eea;
            font-weight: bold;
            font-size: 1.2em;
        }

        @media (max-width: 600px) {
            .options-grid {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 2em;
            }

            .question-text {
                font-size: 1.3em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- شاشة البداية -->
        <div class="welcome-screen active">
            <h1>🎮 كاهوت التعليمي! 🎮</h1>
            <p class="subtitle">اختبار سريع - الهدف الأول: البيانات والمعلومات</p>
            <div style="font-size: 1.2em; color: #666; margin: 30px 0;">
                ⏱️ 20 ثانية لكل سؤال<br>
                📊 5 أسئلة تفاعلية<br>
                🏆 تنافس مع زملائك!
            </div>
            <button class="start-btn" onclick="startQuiz()">ابدأ الاختبار 🚀</button>
        </div>

        <!-- شاشة الأسئلة -->
        <div class="question-screen">
            <div class="question-header">
                <div class="question-number">سؤال <span id="qNum">1</span> من 5</div>
                <div class="question-text" id="questionText"></div>
            </div>

            <div class="timer" id="timer">20</div>

            <div class="options-grid" id="optionsGrid"></div>

            <div class="feedback" id="feedback"></div>
            <button class="next-btn" id="nextBtn" onclick="nextQuestion()">السؤال التالي ⬅️</button>
        </div>

        <!-- شاشة النتائج -->
        <div class="result-screen">
            <h1>🎉 انتهى الاختبار! 🎉</h1>
            <div class="score-board">
                <div class="medal" id="medal">🏆</div>
                <div>نتيجتك النهائية</div>
                <div class="final-score" id="finalScore">0/5</div>
                <div id="performance"></div>
            </div>

            <div class="leaderboard">
                <h3>🏅 لوحة المتصدرين</h3>
                <div id="leaderboardList"></div>
            </div>

            <button class="start-btn" onclick="resetQuiz()" style="margin-top: 30px;">إعادة الاختبار 🔄</button>
        </div>
    </div>

    <script>
        const questions = [
            {
                q: "أي من التالي يعتبر بيانات؟",
                options: ["8/03/2018", "تاريخ تسجيل الجهاز 8/03/2018", "عمر أحمد 15 سنة", "درجة الحرارة 25°"],
                correct: 0,
                colors: ['red', 'blue', 'yellow', 'green']
            },
            {
                q: "الفرق بين البيانات والمعلومات أن المعلومات...",
                options: ["عشوائية", "مترابطة ومفيدة", "أرقام فقط", "غير منظمة"],
                correct: 1,
                colors: ['red', 'blue', 'yellow', 'green']
            },
            {
                q: "أي من التالي يعتبر معلومة مفيدة؟",
                options: ["25", "قلم، سلة", "الوزن 13 كيلوجرام", "شاشة"],
                correct: 2,
                colors: ['red', 'blue', 'yellow', 'green']
            },
            {
                q: "عند تنظيم البيانات وربطها معاً تصبح...",
                options: ["بيانات أخرى", "معلومات", "أرقام", "حروف"],
                correct: 1,
                colors: ['red', 'blue', 'yellow', 'green']
            },
            {
                q: "البيانات هي:",
                options: ["معلومات منظمة", "حقائق أولية منفصلة", "نتائج نهائية", "تقارير جاهزة"],
                correct: 1,
                colors: ['red', 'blue', 'yellow', 'green']
            }
        ];

        let currentQ = 0;
        let score = 0;
        let timeLeft = 20;
        let timerInterval;
        let answered = false;

        function startQuiz() {
            document.querySelector('.welcome-screen').classList.remove('active');
            document.querySelector('.question-screen').classList.add('active');
            showQuestion();
        }

        function showQuestion() {
            answered = false;
            timeLeft = 20;
            clearInterval(timerInterval);

            const q = questions[currentQ];
            document.getElementById('qNum').textContent = currentQ + 1;
            document.getElementById('questionText').textContent = q.q;

            const grid = document.getElementById('optionsGrid');
            grid.innerHTML = q.options.map((opt, i) => `
                <div class="option ${q.colors[i]}" onclick="selectAnswer(${i})">
                    ${opt}
                </div>
            `).join('');

            document.getElementById('feedback').classList.remove('show');
            document.getElementById('nextBtn').classList.remove('show');

            startTimer();
        }

        function startTimer() {
            const timerEl = document.getElementById('timer');
            timerInterval = setInterval(() => {
                timeLeft--;
                timerEl.textContent = timeLeft;

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    if (!answered) {
                        selectAnswer(-1); // time out
                    }
                }
            }, 1000);
        }

        function selectAnswer(index) {
            if (answered) return;
            answered = true;
            clearInterval(timerInterval);

            const q = questions[currentQ];
            const options = document.querySelectorAll('.option');
            const isCorrect = index === q.correct;

            options.forEach((opt, i) => {
                opt.style.pointerEvents = 'none';
                if (i === index) {
                    opt.classList.add(isCorrect ? 'correct' : 'wrong');
                }
                if (i === q.correct) {
                    opt.classList.add('correct');
                }
            });

            const feedback = document.getElementById('feedback');
            if (index === -1) {
                feedback.textContent = '⏰ انتهى الوقت! الإجابة الصحيحة: ' + q.options[q.correct];
                feedback.className = 'feedback show wrong';
            } else if (isCorrect) {
                score++;
                feedback.textContent = '✅ إجابة صحيحة! ممتاز! 🎉';
                feedback.className = 'feedback show correct';
            } else {
                feedback.textContent = '❌ إجابة خاطئة. الإجابة الصحيحة: ' + q.options[q.correct];
                feedback.className = 'feedback show wrong';
            }

            document.getElementById('nextBtn').classList.add('show');
        }

        function nextQuestion() {
            currentQ++;
            if (currentQ < questions.length) {
                showQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            document.querySelector('.question-screen').classList.remove('active');
            document.querySelector('.result-screen').classList.add('active');

            document.getElementById('finalScore').textContent = `${score}/${questions.length}`;

            const percentage = (score / questions.length) * 100;
            let medal = '🥉';
            let performance = 'جيد! حاول مرة أخرى';

            if (percentage === 100) {
                medal = '🥇';
                performance = 'ممتاز! أجبت على جميع الأسئلة!';
            } else if (percentage >= 80) {
                medal = '🥈';
                performance = 'رائع جداً! أداء متميز!';
            } else if (percentage >= 60) {
                medal = '🥉';
                performance = 'جيد! يمكنك التحسين!';
            } else {
                medal = '📚';
                performance = 'حاول مراجعة الدرس مرة أخرى';
            }

            document.getElementById('medal').textContent = medal;
            document.getElementById('performance').textContent = performance;

            // لوحة المتصدرين (تجريبية)
            const leaderboard = [
                { name: 'أنت', score: score },
                { name: 'أحمد', score: 4 },
                { name: 'فاطمة', score: 5 },
                { name: 'محمد', score: 3 },
                { name: 'نورة', score: 4 }
            ].sort((a, b) => b.score - a.score);

            document.getElementById('leaderboardList').innerHTML = leaderboard.map((item, i) => `
                <div class="rank-item" style="${item.name === 'أنت' ? 'background: #fff3cd;' : ''}">
                    <div class="rank-number">${i + 1}</div>
                    <div class="rank-name">${item.name} ${item.name === 'أنت' ? '👤' : ''}</div>
                    <div class="rank-score">${item.score}/5</div>
                </div>
            `).join('');
        }

        function resetQuiz() {
            currentQ = 0;
            score = 0;
            document.querySelector('.result-screen').classList.remove('active');
            document.querySelector('.welcome-screen').classList.add('active');
        }
    </script>
</body>
</html>
