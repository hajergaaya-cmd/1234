<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المحقق والشاهد — البرمجيات الخبيثة | الشعبة الثانية</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--surface:#f7f8fc;--border:#dde6f0;--text:#1a1a2e;--text2:#5a6a8a;--teal:#0e7a6a;--gold:#c07a00;--red:#e74c3c;--green:#27ae60;--shadow:0 2px 12px rgba(0,0,0,.08)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Tajawal',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;direction:rtl}
.landing-header{background:#fff;border-bottom:3px solid var(--teal);padding:16px 22px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:10;box-shadow:var(--shadow)}
.lh-logo{font-size:2rem}.lh-title{font-size:1.3rem;font-weight:800;color:var(--teal)}.lh-sub{font-size:.8rem;color:var(--text2)}
.class-badge{margin-right:auto;background:#e8f4ff;border:1.5px solid #4a9aff;color:#1a5aaa;border-radius:20px;padding:5px 16px;font-size:.85rem;font-weight:700}
.landing-body{max-width:980px;margin:0 auto;padding:22px 18px}
.landing-intro{background:#eef8f5;border:1.5px solid #c8e8e0;border-radius:14px;padding:16px 18px;margin-bottom:22px;font-size:.93rem;line-height:1.85;color:var(--text2)}
.landing-intro strong{color:var(--teal);font-weight:700}
.pairs-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.pair-card{border-radius:14px;padding:16px;cursor:pointer;border:2px solid;transition:all .2s;background:#fff}
.pair-card:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.12)}
.pc-num{font-size:.72rem;font-weight:700;opacity:.7;margin-bottom:4px}
.pc-names{font-size:.9rem;font-weight:700;line-height:1.7;margin-bottom:6px;color:var(--text)}
.pc-status{font-size:.72rem;padding:2px 9px;border-radius:8px;font-weight:600}
.pc-idle{background:#f0f0f0;color:var(--text2)}.pc-active{background:#e8f8ee;color:var(--green)}.pc-done{background:#e8eef8;color:#3a5a9a}
.pair-room{position:fixed;inset:0;background:#fff;z-index:100;display:none;flex-direction:column;overflow-y:auto}
.pr-header{background:#fff;border-bottom:2px solid var(--border);padding:13px 18px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5}
.pr-back{background:none;border:1.5px solid var(--border);border-radius:8px;padding:5px 12px;font-family:'Tajawal',sans-serif;font-size:.85rem;cursor:pointer;color:var(--text2)}
.pr-back:hover{border-color:var(--red);color:var(--red)}
.pr-title{font-size:1rem;font-weight:800;color:var(--teal)}
.pr-body{max-width:560px;margin:0 auto;padding:26px 18px 50px;width:100%}
.who-card{background:var(--surface);border:1.5px solid var(--border);border-radius:16px;padding:22px;text-align:center;margin-bottom:14px}
.who-title{font-size:1.1rem;font-weight:800;margin-bottom:5px}.who-sub{font-size:.88rem;color:var(--text2);margin-bottom:18px}
.name-btns{display:flex;flex-direction:column;gap:10px}
.name-btn{background:#fff;border:2px solid var(--border);border-radius:12px;padding:14px 16px;font-family:'Tajawal',sans-serif;font-size:.97rem;font-weight:700;cursor:pointer;text-align:right;color:var(--text);display:flex;align-items:center;gap:10px;transition:all .2s;width:100%}
.name-btn:hover{border-color:var(--teal);background:#eef8f5}
.nb-icon{width:34px;height:34px;border-radius:50%;background:var(--teal);color:#fff;display:flex;align-items:center;justify-content:center;font-size:.9rem;flex-shrink:0}
.waiting-card{text-align:center;padding:36px 20px;color:var(--text2)}
.wc-spin{font-size:2.8rem;margin-bottom:10px;display:block;animation:spin 2.5s linear infinite}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.wc-msg{font-size:1rem;font-weight:700;color:var(--text);margin-bottom:4px}.wc-sub{font-size:.85rem}
.role-badge{border-radius:12px;padding:14px 16px;margin-bottom:16px;display:flex;align-items:center;gap:12px}
.rb-inv{background:#eef8f5;border:2px solid var(--teal)}.rb-wit{background:#fdf8ee;border:2px solid var(--gold)}
.rb-icon{font-size:1.8rem;flex-shrink:0}.rb-title{font-size:1rem;font-weight:800}.rb-sub{font-size:.82rem;color:var(--text2);margin-top:2px}
.rb-inv .rb-title{color:var(--teal)}.rb-wit .rb-title{color:var(--gold)}
.qbank-title{font-size:.9rem;font-weight:700;color:var(--text2);margin-bottom:10px}
.q-list{display:flex;flex-direction:column;gap:8px}
.q-pick-btn{background:#fff;border:1.5px solid var(--border);border-radius:10px;padding:13px 16px;font-family:'Tajawal',sans-serif;font-size:.9rem;font-weight:600;cursor:pointer;text-align:right;color:var(--text);transition:all .2s;line-height:1.6;width:100%}
.q-pick-btn:hover{border-color:var(--teal);background:#eef8f5;color:var(--teal)}
.q-pick-btn.picked{border-color:var(--teal);background:#eef8f5;color:var(--teal);font-weight:800;pointer-events:none}
.confirm-btn{width:100%;margin-top:12px;padding:14px;border:none;border-radius:12px;font-family:'Tajawal',sans-serif;font-size:1rem;font-weight:800;cursor:pointer;background:var(--teal);color:#fff;transition:opacity .2s;display:none}
.confirm-btn.show{display:block}.confirm-btn:hover{opacity:.9}
.q-display{background:var(--surface);border:2px solid var(--teal);border-radius:14px;padding:18px;margin-bottom:16px}
.qd-label{font-size:.75rem;font-weight:700;color:var(--teal);margin-bottom:7px}
.qd-text{font-size:1.02rem;font-weight:700;color:var(--text);line-height:1.7}
.ans-list{display:flex;flex-direction:column;gap:9px;margin-bottom:14px}
.ans-btn{background:#fff;border:2px solid var(--border);border-radius:10px;padding:13px 14px;font-family:'Tajawal',sans-serif;font-size:.92rem;font-weight:600;cursor:pointer;text-align:right;color:var(--text);transition:all .2s;line-height:1.6;display:flex;align-items:center;gap:10px;width:100%}
.ans-btn:hover{border-color:var(--gold);background:#fdf8ee}
.ans-btn.sel{border-color:var(--gold);background:#fdf8ee;font-weight:800}
.ans-letter{width:28px;height:28px;border-radius:50%;background:var(--surface);border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:.78rem;font-weight:800;flex-shrink:0;pointer-events:none;transition:all .2s}
.ans-btn.sel .ans-letter{background:var(--gold);border-color:var(--gold);color:#fff}
.submit-ans-btn{width:100%;padding:14px;border:none;border-radius:12px;font-family:'Tajawal',sans-serif;font-size:1rem;font-weight:800;cursor:pointer;background:var(--gold);color:#fff;transition:opacity .2s}
.submit-ans-btn:hover{opacity:.9}.submit-ans-btn:disabled{background:#ccc;cursor:default}
.result-card{border-radius:14px;padding:20px;text-align:center;margin-bottom:14px}
.rc-ok{background:#e8f8ee;border:2px solid var(--green)}.rc-no{background:#fee8e8;border:2px solid var(--red)}
.rc-icon{font-size:2.6rem;margin-bottom:8px}.rc-title{font-size:1.1rem;font-weight:800;margin-bottom:6px}
.rc-ok .rc-title{color:var(--green)}.rc-no .rc-title{color:var(--red)}
.rc-detail{font-size:.88rem;color:var(--text2);line-height:1.75;text-align:right}
.r2-btn{width:100%;padding:14px;border:none;border-radius:12px;font-family:'Tajawal',sans-serif;font-size:1rem;font-weight:800;cursor:pointer;background:var(--teal);color:#fff}
.r2-btn:hover{opacity:.9}
.final-card{background:var(--surface);border:2px solid var(--teal);border-radius:16px;padding:24px 20px;text-align:center}
.fc-icon{font-size:3rem;margin-bottom:10px}.fc-title{font-size:1.2rem;font-weight:800;color:var(--teal);margin-bottom:14px}
.fc-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.fc-box{background:#fff;border:1.5px solid var(--border);border-radius:10px;padding:12px 8px;text-align:center}
.fcb-role{font-size:.7rem;color:var(--text2);margin-bottom:2px}.fcb-name{font-size:.88rem;font-weight:700;margin-bottom:6px}
.fcb-val{font-size:1.4rem;font-weight:800}.fok{color:var(--green)}.fno{color:var(--red)}
.sent-ok{background:#e8f8ee;border:1px solid var(--green);border-radius:8px;padding:9px;color:var(--green);font-size:.88rem;font-weight:700}
.divider{display:flex;align-items:center;gap:10px;margin:16px 0;color:var(--text2);font-size:.85rem}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border)}
</style>
</head>
<body>
<div id="landingScreen">
  <div class="landing-header">
    <div class="lh-logo">🔍</div>
    <div><div class="lh-title">المحقق والشاهد — البرمجيات الخبيثة</div><div class="lh-sub">ابحثي عن ثنائيكِ واضغطي للدخول</div></div>
    <div class="class-badge">🏫 الشعبة الثانية</div>
  </div>
  <div class="landing-body">
    <div class="landing-intro">🎯 <strong>كيف يعمل النشاط؟</strong> كل ثنائي يدخل غرفته — <strong>المحقق 🔍</strong> يختار سؤالاً — <strong>الشاهدة 👁️</strong> تجيب — ثم <strong>يتبادلان الدور!</strong></div>
    <div class="pairs-grid" id="pairsGrid"><div style="grid-column:1/-1;text-align:center;padding:30px;color:var(--text2)">⏳ جاري التحميل...</div></div>
  </div>
</div>
<div class="pair-room" id="pairRoom">
  <div class="pr-header">
    <button class="pr-back" onclick="leavePair()">← العودة</button>
    <div class="pr-title" id="prTitle">الثنائي</div>
  </div>
  <div class="pr-body" id="prBody"></div>
</div>
<script>
const DB='https://cyber-safety-class-default-rtdb.firebaseio.com';
const CLASS_KEY='c2'; // Class 2 uses separate Firebase node

const PAIRS=[
  {id:'c2p1',n:1,s1:'أباء أسامه',s2:'الجازي فيصل'},
  {id:'c2p2',n:2,s1:'الريم حميد',s2:'الريم ناصر'},
  {id:'c2p3',n:3,s1:'ايلا سامر',s2:'ايه اسحق'},
  {id:'c2p4',n:4,s1:'بلسم فارس',s2:'بلقيس نوراحمد'},
  {id:'c2p5',n:5,s1:'حنين علاء',s2:'حنين محمد'},
  {id:'c2p6',n:6,s1:'دانه عبدالرحمن',s2:'رهف محمد'},
  {id:'c2p7',n:7,s1:'رهف هياب',s2:'روضة رضا'},
  {id:'c2p8',n:8,s1:'ساره سعود',s2:'سجى محمد'},
  {id:'c2p9',n:9,s1:'سما احمد',s2:'ضحى محمد'},
  {id:'c2p10',n:10,s1:'عائشه موسى',s2:'فاطمه حكيم'},
  {id:'c2p11',n:11,s1:'فاطمه عبدالله',s2:'ليان هانى'},
  {id:'c2p12',n:12,s1:'مريم سعيد',s2:'نور محمود',s3:'نوران عرفات'},
];

const QS=[
  {q:'ما تعريف البرمجيات الخبيثة؟',opts:['برامج تهدف لإتلاف البيانات أو الإضرار بالأجهزة','برامج لتسريع الجهاز وتحسين أدائه','برامج لتحديث نظام التشغيل تلقائياً','برامج لتشفير الملفات وحمايتها'],c:0},
  {q:'من يُنشئ البرمجيات الخبيثة؟',opts:['شركات البرمجيات الكبرى فقط','أشخاص خبراء في البرمجة وشبكات الحاسوب','الحكومات الإلكترونية فقط','لا أحد — تُنشأ تلقائياً'],c:1},
  {q:'ما وظيفة دودة Worm؟',opts:['تعرض إعلانات مزعجة على الشاشة','تتنكر كبرنامج مفيد لسرقة البيانات','تنسخ نفسها وتنتشر عبر الشبكة وتدمر الملفات','تجمع معلومات المستخدم سراً'],c:2},
  {q:'لماذا يُسمى Trojan بحصان طروادة؟',opts:['لأنه ينتشر بسرعة كبيرة جداً','لأنه يتنكر كبرنامج مفيد ثم يسرق البيانات','لأنه يُدمر جميع الملفات فوراً','لأنه يعمل في الخفاء دون أي ضرر'],c:1},
  {q:'ماذا تفعل برامج Spyware؟',opts:['تبطئ الحاسوب وتستهلك الذاكرة','تعرض إعلانات مزعجة في نوافذ','تجمع معلومات المستخدم ونشاطه سراً','تدمر ملفات الحاسوب وتمحوها'],c:2},
  {q:'ما الذي يميز Adware عن غيرها؟',opts:['تشفر الملفات وتطلب فدية مالية','تعرض إعلانات مزعجة في نوافذ منبثقة دون إذن','تسرق كلمات المرور والبيانات البنكية','تنسخ نفسها وتنتشر بين الحواسيب'],c:1},
  {q:'كيف تنتشر دودة Worm بشكل رئيسي؟',opts:['عن طريق لمس الشاشة أو لوحة المفاتيح','عبر البريد الإلكتروني والروابط المشبوهة والشبكات','عن طريق الكاميرا والميكروفون','لا تنتشر — تبقى في جهاز واحد فقط'],c:1},
  {q:'ما أفضل طريقة للحماية من البرمجيات الخبيثة؟',opts:['إيقاف الجهاز عند عدم الاستخدام','حذف جميع البرامج من الحاسوب','تحديث برنامج مكافحة الفيروسات وعدم فتح الروابط المشبوهة','عدم الاتصال بالإنترنت نهائياً'],c:2},
];

const COLORS=['#0e7a6a','#c07a00','#7c4dff','#0e5a8f','#8f3a0e','#2a8f0e','#7a0e5a','#0e8a8f','#5a3a0e','#3a0e8f','#0e3a7a','#7a5a0e'];
let currentPair=null,myName='',syncInterval=null,pendingQIdx=-1,selectedAnswer=-1;

async function dbGet(p){try{const r=await fetch(`${DB}/${p}.json`);return await r.json();}catch(e){return null;}}
async function dbSet(p,v){try{await fetch(`${DB}/${p}.json`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(v)});}catch(e){}}
async function dbPatch(p,v){try{await fetch(`${DB}/${p}.json`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(v)});}catch(e){}}

function showScreen(id){
  document.getElementById('landingScreen').style.display=id==='landing'?'block':'none';
  document.getElementById('pairRoom').style.display=id==='pair'?'flex':'none';
}

async function renderLanding(){
  const allData=await dbGet(`detective_pairs_c2`)||{};
  const grid=document.getElementById('pairsGrid');
  grid.innerHTML=PAIRS.map((p,i)=>{
    const d=allData[p.id]||{};
    const col=COLORS[i];
    const isDone=d.status==='done',isActive=d.status&&d.status!=='idle'&&!isDone;
    const statusCls=isDone?'pc-done':isActive?'pc-active':'pc-idle';
    const statusTxt=isDone?'✅ اكتمل':isActive?'🔴 جارٍ':'⚪ في الانتظار';
    const names=[p.s1,p.s2,p.s3].filter(Boolean).join(' + ');
    return `<div class="pair-card" style="border-color:${col}" onclick="enterPair('${p.id}')">
      <div class="pc-num" style="color:${col}">الثنائي ${p.n}</div>
      <div class="pc-names">${names}</div>
      <span class="pc-status ${statusCls}">${statusTxt}</span>
    </div>`;
  }).join('');
}

async function enterPair(pairId){
  currentPair=PAIRS.find(p=>p.id===pairId);
  myName='';pendingQIdx=-1;selectedAnswer=-1;
  document.getElementById('prTitle').textContent='الثنائي '+currentPair.n+' — '+[currentPair.s1,currentPair.s2,currentPair.s3].filter(Boolean).join(' + ');
  showScreen('pair');
  renderNameSelection();
  clearInterval(syncInterval);
  syncInterval=setInterval(()=>{if(myName)syncAndRender();},2500);
}

function leavePair(){
  currentPair=null;myName='';
  clearInterval(syncInterval);
  showScreen('landing');
  renderLanding();
}

function renderNameSelection(){
  const p=currentPair;
  const names=[p.s1,p.s2,p.s3].filter(Boolean);
  document.getElementById('prBody').innerHTML=`
    <div class="who-card">
      <div class="who-title">👋 من أنتِ؟</div>
      <div class="who-sub">اضغطي على اسمكِ للدخول</div>
      <div class="name-btns">
        ${names.map(n=>`<button class="name-btn" onclick="selectName('${n.replace(/'/g,"\\'")}')"><div class="nb-icon">${n.charAt(0)}</div><span>${n}</span></button>`).join('')}
      </div>
    </div>`;
}

async function selectName(name){
  myName=name;
  const d=await dbGet(`detective_pairs_c2/${currentPair.id}`)||{};
  if(!d.status||d.status==='idle'){
    await dbSet(`detective_pairs_c2/${currentPair.id}`,{status:'r1_q',inv1:name,wit1:'',qIdx1:-1,ans1:-1,inv2:'',wit2:'',qIdx2:-1,ans2:-1});
  } else if((d.status==='r1_q'||d.status==='r1_a')&&d.inv1!==name&&!d.wit1){
    await dbPatch(`detective_pairs_c2/${currentPair.id}`,{wit1:name});
  }
  await syncAndRender();
}

async function syncAndRender(){
  if(!currentPair||!myName)return;
  const d=await dbGet(`detective_pairs_c2/${currentPair.id}`);
  if(!d)return;
  renderRoom(d);
}

function renderRoom(d){
  const body=document.getElementById('prBody');
  if(d.status==='r1_q'){
    if(myName===d.inv1){renderInvestigator(d,1);}
    else{body.innerHTML=`<div class="role-badge rb-wit"><div class="rb-icon">👁️</div><div><div class="rb-title">أنتِ الشاهدة</div><div class="rb-sub">انتظري المحقق لاختيار السؤال...</div></div></div><div class="waiting-card"><span class="wc-spin">⏳</span><div class="wc-msg">المحقق يختار السؤال الآن</div><div class="wc-sub">ستظهر لكِ الخيارات فور اختياره</div></div>`;}
  } else if(d.status==='r1_a'){
    if(myName===d.wit1||(!d.wit1&&myName!==d.inv1)){renderWitness(d,1);}
    else{body.innerHTML=`<div class="role-badge rb-inv"><div class="rb-icon">🔍</div><div><div class="rb-title">أنتِ المحقق — الجولة 1</div><div class="rb-sub">انتظري إجابة الشاهدة</div></div></div><div class="q-display"><div class="qd-label">السؤال الذي اخترتِه:</div><div class="qd-text">${QS[d.qIdx1].q}</div></div><div class="waiting-card"><span class="wc-spin">💭</span><div class="wc-msg">الشاهدة تجيب الآن...</div></div>`;}
  } else if(d.status==='r1_done'){renderRoundResult(d,1);}
  else if(d.status==='r2_q'){
    if(myName===d.inv2){renderInvestigator(d,2);}
    else{body.innerHTML=`<div class="divider">الجولة الثانية</div><div class="role-badge rb-wit"><div class="rb-icon">👁️</div><div><div class="rb-title">أنتِ الشاهدة — الجولة 2</div><div class="rb-sub">انتظري المحقق...</div></div></div><div class="waiting-card"><span class="wc-spin">⏳</span><div class="wc-msg">المحقق الجديد يختار السؤال</div></div>`;}
  } else if(d.status==='r2_a'){
    if(myName===d.wit2){renderWitness(d,2);}
    else{body.innerHTML=`<div class="divider">الجولة الثانية</div><div class="role-badge rb-inv"><div class="rb-icon">🔍</div><div><div class="rb-title">أنتِ المحقق — الجولة 2</div><div class="rb-sub">انتظري إجابة الشاهدة</div></div></div><div class="q-display"><div class="qd-label">السؤال الذي اخترتِه:</div><div class="qd-text">${QS[d.qIdx2].q}</div></div><div class="waiting-card"><span class="wc-spin">💭</span><div class="wc-msg">الشاهدة تجيب الآن...</div></div>`;}
  } else if(d.status==='r2_done'||d.status==='done'){renderFinal(d);}
}

function renderInvestigator(d,round){
  pendingQIdx=-1;
  const usedQ=round===2?d.qIdx1:-1;
  const available=QS.map((q,i)=>({q,i})).filter(({i})=>i!==usedQ);
  document.getElementById('prBody').innerHTML=`
    ${round===2?'<div class="divider">الجولة الثانية — أنتِ الآن المحقق!</div>':''}
    <div class="role-badge rb-inv"><div class="rb-icon">🔍</div><div><div class="rb-title">أنتِ المحقق — الجولة ${round}</div><div class="rb-sub">اختاري سؤالاً لتسأل به شريكتكِ</div></div></div>
    <div class="qbank-title">📚 اختاري سؤالاً واحداً:</div>
    <div class="q-list">
      ${available.map(({q,i})=>`<button class="q-pick-btn" onclick="pickQ(${i},${round},this)">${q.q}</button>`).join('')}
    </div>
    <button class="confirm-btn" id="confirmBtn" onclick="confirmQ(${round})">✅ تأكيد السؤال وإرساله للشاهدة</button>`;
}

function pickQ(qIdx,round,btn){
  pendingQIdx=qIdx;
  document.querySelectorAll('.q-pick-btn').forEach(b=>b.classList.remove('picked'));
  btn.classList.add('picked');
  const cb=document.getElementById('confirmBtn');
  if(cb){cb.classList.add('show');}
}

async function confirmQ(round){
  if(pendingQIdx===-1)return;
  const newStatus=round===1?'r1_a':'r2_a';
  const upd=round===1?{status:newStatus,qIdx1:pendingQIdx}:{status:newStatus,qIdx2:pendingQIdx};
  await dbPatch(`detective_pairs_c2/${currentPair.id}`,upd);
  pendingQIdx=-1;
  await syncAndRender();
}

function renderWitness(d,round){
  selectedAnswer=-1;
  const qIdx=round===1?d.qIdx1:d.qIdx2;
  const q=QS[qIdx];
  const letters=['أ','ب','ج','د'];
  document.getElementById('prBody').innerHTML=`
    ${round===2?'<div class="divider">الجولة الثانية — أنتِ الآن الشاهدة!</div>':''}
    <div class="role-badge rb-wit"><div class="rb-icon">👁️</div><div><div class="rb-title">أنتِ الشاهدة — الجولة ${round}</div><div class="rb-sub">اختاري الإجابة الصحيحة</div></div></div>
    <div class="q-display"><div class="qd-label">🔍 سؤال المحقق:</div><div class="qd-text">${q.q}</div></div>
    <div class="ans-list">
      ${q.opts.map((opt,i)=>`<button class="ans-btn" id="ans${i}" onclick="selAns(${i})"><div class="ans-letter">${letters[i]}</div><span>${opt}</span></button>`).join('')}
    </div>
    <button class="submit-ans-btn" id="subAnsBtn" onclick="submitAns(${round})" disabled>✅ أرسلي إجابتكِ</button>`;
}

function selAns(idx){
  selectedAnswer=idx;
  document.querySelectorAll('.ans-btn').forEach(b=>b.classList.remove('sel'));
  document.getElementById('ans'+idx).classList.add('sel');
  document.getElementById('subAnsBtn').disabled=false;
}

async function submitAns(round){
  if(selectedAnswer===-1)return;
  const upd=round===1?{ans1:selectedAnswer,status:'r1_done'}:{ans2:selectedAnswer,status:'r2_done'};
  await dbPatch(`detective_pairs_c2/${currentPair.id}`,upd);
  selectedAnswer=-1;
  await syncAndRender();
}

function renderRoundResult(d,round){
  const qIdx=round===1?d.qIdx1:d.qIdx2;
  const ans=round===1?d.ans1:d.ans2;
  const witName=round===1?d.wit1:d.wit2;
  const q=QS[qIdx];
  const ok=ans===q.c;
  document.getElementById('prBody').innerHTML=`
    <div class="result-card ${ok?'rc-ok':'rc-no'}">
      <div class="rc-icon">${ok?'🎉':'💪'}</div>
      <div class="rc-title">${ok?'إجابة صحيحة!':'إجابة خاطئة'}</div>
      <div class="rc-detail">
        <strong>السؤال:</strong> ${q.q}<br>
        <strong>إجابة ${witName||'الشاهدة'}:</strong> ${q.opts[ans]||'—'}<br>
        ${!ok?`<strong style="color:var(--green)">الإجابة الصحيحة:</strong> ${q.opts[q.c]}`:''}
      </div>
    </div>
    <button class="r2-btn" onclick="startRound2()">🔄 الجولة الثانية — تبادل الأدوار</button>`;
}

async function startRound2(){
  const d=await dbGet(`detective_pairs_c2/${currentPair.id}`);
  const newInv=d.wit1,newWit=d.inv1;
  await dbPatch(`detective_pairs_c2/${currentPair.id}`,{status:'r2_q',inv2:newInv,wit2:newWit});
  await syncAndRender();
}

async function renderFinal(d){
  if(d.status!=='done'){
    await dbSet(`detective_pairs_c2/${currentPair.id}/status`,'done');
    const r={pair:'الثنائي '+currentPair.n,s1:currentPair.s1,s2:currentPair.s2,
      r1_inv:d.inv1,r1_wit:d.wit1||'—',r1_q:QS[d.qIdx1]?.q||'—',r1_correct:d.ans1===QS[d.qIdx1]?.c,
      r2_inv:d.inv2||'—',r2_wit:d.wit2||'—',r2_q:QS[d.qIdx2>=0?d.qIdx2:0]?.q||'—',r2_correct:d.ans2===QS[d.qIdx2>=0?d.qIdx2:0]?.c,
      time:new Date().toLocaleTimeString('ar-QA')};
    await dbSet(`detective_results_c2/${currentPair.id}`,r);
  }
  const q1=QS[d.qIdx1>=0?d.qIdx1:0],q2=QS[d.qIdx2>=0?d.qIdx2:0];
  const ok1=d.ans1===q1?.c,ok2=d.ans2===q2?.c;
  document.getElementById('prBody').innerHTML=`
    <div class="final-card">
      <div class="fc-icon">🏁</div>
      <div class="fc-title">انتهى النشاط — أحسنتما! 🌟</div>
      <div class="fc-grid">
        <div class="fc-box"><div class="fcb-role">🔍 الجولة 1</div><div class="fcb-name">${d.wit1||'—'}</div><div class="fcb-val ${ok1?'fok':'fno'}">${ok1?'✅ صح':'❌ خطأ'}</div></div>
        <div class="fc-box"><div class="fcb-role">🔍 الجولة 2</div><div class="fcb-name">${d.wit2||'—'}</div><div class="fcb-val ${ok2?'fok':'fno'}">${ok2?'✅ صح':'❌ خطأ'}</div></div>
      </div>
      <div class="sent-ok">✅ نتيجة ثنائيكما ظهرت على شاشة المعلمة!</div>
    </div>`;
  clearInterval(syncInterval);
}

window.onload=()=>{renderLanding();setInterval(renderLanding,8000);};
</script>
</body>
</html>
