<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نشاط 1: سحابة الكلمات التفاعلية</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 900px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        h1 {
            color: #667eea;
            text-align: center;
            margin-bottom: 15px;
            font-size: 2.5em;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 1.2em;
        }

        .question {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            font-size: 1.4em;
            margin-bottom: 30px;
            font-weight: bold;
        }

        .input-section {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        #wordInput {
            flex: 1;
            padding: 15px;
            border: 2px solid #667eea;
            border-radius: 10px;
            font-size: 1.1em;
            transition: all 0.3s;
        }

        #wordInput:focus {
            outline: none;
            border-color: #764ba2;
            box-shadow: 0 0 10px rgba(102, 126, 234, 0.3);
        }

        #addBtn {
            padding: 15px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1em;
            cursor: pointer;
            transition: transform 0.2s;
            font-weight: bold;
        }

        #addBtn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        #addBtn:active {
            transform: translateY(0);
        }

        .word-cloud {
            min-height: 300px;
            border: 3px dashed #667eea;
            border-radius: 15px;
            padding: 30px;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            align-items: center;
            background: #f8f9ff;
            margin-bottom: 20px;
        }

        .word {
            padding: 10px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 25px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            animation: popIn 0.5s ease-out;
            position: relative;
        }

        .word:hover {
            transform: scale(1.1) rotate(-2deg);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .word .count {
            position: absolute;
            top: -8px;
            right: -8px;
            background: #ff6b6b;
            color: white;
            border-radius: 50%;
            width: 25px;
            height: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8em;
            font-weight: bold;
        }

        @keyframes popIn {
            from {
                transform: scale(0);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .stats {
            text-align: center;
            color: #666;
            font-size: 1.1em;
            margin-top: 20px;
        }

        .stats strong {
            color: #667eea;
        }

        .clear-btn {
            display: block;
            margin: 20px auto 0;
            padding: 12px 30px;
            background: #ff6b6b;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s;
        }

        .clear-btn:hover {
            background: #ff5252;
            transform: translateY(-2px);
        }

        .instruction {
            background: #fff3cd;
            border-right: 4px solid #ffc107;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            color: #856404;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }
            
            h1 {
                font-size: 1.8em;
            }
            
            .question {
                font-size: 1.1em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌟 سحابة الكلمات التفاعلية 🌟</h1>
        <p class="subtitle">نشاط التمهيد - الهدف الأول</p>

        <div class="instruction">
            💡 <strong>تعليمات:</strong> اكتب إجابتك على السؤال أدناه، ثم اضغط "إضافة". ستظهر الكلمات الأكثر تكراراً بحجم أكبر!
        </div>

        <div class="question">
            🤔 عندما تريد معرفة حالة الطقس اليوم، ماذا تفعل؟
        </div>

        <div class="input-section">
            <input type="text" id="wordInput" placeholder="اكتب إجابتك هنا..." />
            <button id="addBtn">إضافة ✨</button>
        </div>

        <div class="word-cloud" id="wordCloud"></div>

        <div class="stats">
            عدد الإجابات: <strong id="totalCount">0</strong> | 
            الكلمات الفريدة: <strong id="uniqueCount">0</strong>
        </div>

        <button class="clear-btn" onclick="clearAll()">🗑️ مسح الكل</button>
    </div>

    <script>
        const wordMap = new Map();
        
        function addWord() {
            const input = document.getElementById('wordInput');
            const word = input.value.trim();
            
            if (!word) {
                alert('⚠️ الرجاء كتابة كلمة أو عبارة!');
                return;
            }
            
            const lowerWord = word.toLowerCase();
            const count = wordMap.get(lowerWord) || 0;
            wordMap.set(lowerWord, count + 1);
            
            input.value = '';
            input.focus();
            
            updateCloud();
            updateStats();
        }
        
        function updateCloud() {
            const cloud = document.getElementById('wordCloud');
            cloud.innerHTML = '';
            
            const sortedWords = Array.from(wordMap.entries())
                .sort((a, b) => b[1] - a[1]);
            
            const maxCount = sortedWords[0]?.[1] || 1;
            
            sortedWords.forEach(([word, count]) => {
                const wordEl = document.createElement('div');
                wordEl.className = 'word';
                
                const scale = 0.8 + (count / maxCount) * 1.2;
                wordEl.style.fontSize = `${scale}em`;
                
                if (count > 1) {
                    const countBadge = document.createElement('span');
                    countBadge.className = 'count';
                    countBadge.textContent = count;
                    wordEl.appendChild(countBadge);
                }
                
                const textNode = document.createTextNode(word);
                wordEl.appendChild(textNode);
                
                wordEl.onclick = () => {
                    if (confirm(`هل تريد حذف "${word}"؟`)) {
                        wordMap.delete(word.toLowerCase());
                        updateCloud();
                        updateStats();
                    }
                };
                
                cloud.appendChild(wordEl);
            });
        }
        
        function updateStats() {
            const total = Array.from(wordMap.values()).reduce((a, b) => a + b, 0);
            document.getElementById('totalCount').textContent = total;
            document.getElementById('uniqueCount').textContent = wordMap.size;
        }
        
        function clearAll() {
            if (confirm('هل أنت متأكد من حذف جميع الكلمات؟')) {
                wordMap.clear();
                updateCloud();
                updateStats();
            }
        }
        
        document.getElementById('addBtn').addEventListener('click', addWord);
        document.getElementById('wordInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') addWord();
        });
        
        // بيانات تجريبية للعرض
        const sampleData = [
            'تطبيق الطقس', 'الإنترنت', 'جوجل', 'تطبيق الطقس', 
            'الأرقام', 'درجة الحرارة', 'تطبيق الطقس'
        ];
        
        setTimeout(() => {
            sampleData.forEach(word => {
                const lowerWord = word.toLowerCase();
                const count = wordMap.get(lowerWord) || 0;
                wordMap.set(lowerWord, count + 1);
            });
            updateCloud();
            updateStats();
        }, 500);
    </script>
</body>
</html>
