<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نشاط 1 - تعريف الروبوت</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Tajawal',sans-serif;background:#F0FFF4;min-height:100vh}
.top-bar{background:linear-gradient(135deg,#11998e,#38ef7d);padding:12px 22px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 4px 15px rgba(17,153,142,0.4)}
.top-bar h1{color:#fff;font-size:1.3em;font-weight:900}
.timer-box{background:rgba(255,255,255,0.25);border:2px solid rgba(255,255,255,0.5);border-radius:12px;padding:7px 16px;color:#fff;font-size:1.5em;font-weight:900;min-width:76px;text-align:center}
.timer-box.urgent{background:rgba(220,38,38,0.35);border-color:#dc2626;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.6}}
.view{display:none}.view.active{display:block}
/* Name screen */
.center-screen{max-width:650px;margin:50px auto;padding:20px}
.card{background:#fff;border-radius:22px;padding:36px;box-shadow:0 10px 35px rgba(0,0,0,0.1);text-align:center}
.card .icon{font-size:4em;margin-bottom:12px}
.card h2{font-size:1.7em;font-weight:900;color:#1e3a5f;margin-bottom:8px}
.card p{color:#666;margin-bottom:20px}
select.name-sel{width:100%;padding:12px 16px;border:2px solid #11998e;border-radius:12px;font-family:'Tajawal';font-size:1.05em;margin-bottom:16px}
.go-btn{background:linear-gradient(135deg,#11998e,#38ef7d);color:#fff;border:none;border-radius:12px;padding:13px 36px;font-size:1.15em;font-family:'Tajawal';font-weight:800;cursor:pointer;width:100%}
/* Activity area */
.activity-area{max-width:1000px;margin:0 auto;padding:20px}
.student-bar{background:linear-gradient(135deg,#11998e,#38ef7d);border-radius:12px;padding:10px 18px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;color:#fff}
.student-bar .sname{font-weight:800;font-size:1.05em}
.level-badge{background:rgba(255,255,255,0.25);border-radius:8px;padding:3px 14px;font-size:0.9em}
/* Level indicators */
.levels-row{display:flex;gap:10px;margin-bottom:16px}
.lv-dot{flex:1;background:#e0e0e0;border-radius:10px;height:8px;transition:background 0.5s}
.lv-dot.done{background:#11998e}
.lv-dot.active{background:#ffd200;animation:blink 1.2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.5}}
.level-panel{background:#fff;border-radius:20px;padding:24px;box-shadow:0 6px 22px rgba(0,0,0,0.08);min-height:300px}
.level-title{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.level-title .badge{background:linear-gradient(135deg,#11998e,#38ef7d);color:#fff;border-radius:10px;padding:6px 18px;font-weight:800;font-size:0.95em}
.level-title h3{font-size:1.15em;color:#1e3a5f;font-weight:800}
/* Level 1: drag and drop words */
.word-bank{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:20px;padding:14px;background:#F0FFF4;border:2px dashed #11998e;border-radius:12px;min-height:60px}
.word-chip{background:#11998e;color:#fff;border-radius:20px;padding:8px 18px;cursor:grab;font-weight:700;font-size:0.95em;user-select:none;transition:transform 0.2s,box-shadow 0.2s}
.word-chip:hover{transform:scale(1.05);box-shadow:0 4px 12px rgba(17,153,142,0.4)}
.word-chip.dragging{opacity:0.5}
.def-drop-zone{border:2px dashed #ccc;border-radius:12px;padding:18px;min-height:80px;background:#fafafa;direction:rtl;font-size:1.1em;color:#333;line-height:2.2;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.def-drop-zone.drag-over{border-color:#11998e;background:#E8FFF5}
.placed-word{background:#D1FAE5;border:2px solid #11998e;color:#065f46;border-radius:20px;padding:6px 14px;cursor:pointer;font-weight:700;display:inline-block}
.static-text{color:#666;font-size:0.95em;display:inline}
/* Level 2: fill blanks */
.def-text{font-size:1.1em;line-height:2.6;color:#333;direction:rtl}
.blank-input{border:none;border-bottom:2px solid #11998e;background:transparent;font-family:'Tajawal';font-size:1em;width:140px;text-align:center;color:#065f46;font-weight:700;padding:0 4px}
.blank-input:focus{outline:none;border-bottom-color:#38ef7d}
/* Level 3: open */
.open-textarea{width:100%;padding:14px;border:2px solid #11998e;border-radius:12px;font-family:'Tajawal';font-size:1.05em;min-height:120px;resize:vertical;direction:rtl}
.open-textarea:focus{outline:none;border-color:#38ef7d}
.hint-box{background:#F0FFF4;border:1px solid #11998e;border-radius:10px;padding:10px 14px;margin-top:10px;color:#065f46;font-size:0.9em}
/* Next level / submit */
.action-row{display:flex;justify-content:space-between;align-items:center;margin-top:20px;gap:12px}
.next-btn{background:linear-gradient(135deg,#11998e,#38ef7d);color:#fff;border:none;border-radius:12px;padding:12px 30px;font-size:1.05em;font-family:'Tajawal';font-weight:800;cursor:pointer;flex:1}
.skip-btn{background:#f5f5f5;color:#888;border:none;border-radius:12px;padding:12px 20px;font-family:'Tajawal';font-weight:700;cursor:pointer;font-size:0.95em}
.level-timer{color:#888;font-size:0.9em}
/* Success */
.success-area{max-width:560px;margin:60px auto;text-align:center;padding:20px}
.success-card{background:#fff;border-radius:22px;padding:40px;box-shadow:0 10px 35px rgba(0,0,0,0.1)}
.score-big{background:linear-gradient(135deg,#11998e,#38ef7d);color:#fff;border-radius:14px;padding:14px 40px;font-size:1.5em;font-weight:900;display:inline-block;margin:14px 0}
/* Teacher panel */
.teacher-toggle{position:fixed;bottom:20px;left:20px;background:#1a1a2e;color:#fff;border:2px solid #38ef7d;border-radius:12px;padding:10px 18px;font-family:'Tajawal';cursor:pointer;font-weight:700;z-index:100}
.t-panel{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.82);z-index:200;display:none;overflow-y:auto}
.t-panel.open{display:block}
.t-inner{background:#0f172a;min-height:100vh;padding:24px}
.t-inner h2{color:#38ef7d;font-size:1.4em;margin-bottom:18px}
.close-tp{background:#dc2626;color:#fff;border:none;border-radius:10px;padding:8px 18px;font-family:'Tajawal';cursor:pointer;float:left;font-weight:700}
.refresh-tp{background:#4776E6;color:#fff;border:none;border-radius:10px;padding:8px 18px;font-family:'Tajawal';cursor:pointer;font-weight:700;margin-right:10px}
.t-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-top:14px}
.t-card{background:#16213e;border-radius:12px;padding:14px;border:1px solid #333}
.t-card.done{border-color:#38ef7d}
.t-name{color:#ffd200;font-weight:800;font-size:0.9em;margin-bottom:6px}
.t-row{color:#aaa;font-size:0.8em;margin-bottom:3px}
.t-row span{color:#ddd}
.t-status{font-size:0.75em;padding:2px 10px;border-radius:8px;display:inline-block}
.done-s{background:rgba(56,239,125,0.15);color:#38ef7d}
.pend-s{background:rgba(255,165,0,0.12);color:#ffa500}
.t-stat{background:#16213e;border-radius:10px;padding:8px 16px;font-weight:800;display:inline-block;margin-left:10px;margin-bottom:12px}
</style>
</head>
<body>
<div class="top-bar">
  <h1>🤖 نشاط 1 - تعريف الروبوت | ثنائي</h1>
  <div id="timerDisplay" class="timer-box">08:00</div>
</div>

<!-- Name View -->
<div id="nameView" class="view active">
  <div class="center-screen"><div class="card">
    <div class="icon">🤖</div>
    <h2>نشاط اكتشاف التعريف</h2>
    <p>ستعملين مع شريكتك لاكتشاف تعريف الروبوت من خلال ثلاثة مستويات!</p>
    <select id="nameSelect" class="name-sel"><option value="">-- اختاري اسمك --</option></select>
    <button class="go-btn" onclick="startAct()">🚀 ابدئي النشاط</button>
  </div></div>
</div>

<!-- Activity View -->
<div id="actView" class="view">
  <div class="activity-area">
    <div class="student-bar">
      <span class="sname" id="sName"></span>
      <span class="level-badge" id="lvBadge">المستوى 1 من 3</span>
    </div>
    <div class="levels-row">
      <div class="lv-dot active" id="dot0"></div>
      <div class="lv-dot" id="dot1"></div>
      <div class="lv-dot" id="dot2"></div>
    </div>
    <div class="level-panel" id="levelPanel"></div>
    <div class="action-row">
      <span class="level-timer" id="lvTimer">⏱ دقيقة للمستوى</span>
      <button class="skip-btn" onclick="nextLevel()">تخطي ←</button>
      <button class="next-btn" id="nextBtn" onclick="nextLevel()">التالي ←</button>
    </div>
  </div>
</div>

<!-- Success -->
<div id="successView" class="view">
  <div class="success-area"><div class="success-card">
    <div style="font-size:3.5em;margin-bottom:12px">🎉</div>
    <h2 style="color:#11998e;font-size:1.8em;margin-bottom:8px">أحسنتِ!</h2>
    <div class="score-big" id="finalScore">+20 نقطة!</div>
    <p style="color:#555">تم حفظ إجاباتك. انتظري النشاط التالي من المعلمة.</p>
  </div></div>
</div>

<button class="teacher-toggle" onclick="toggleT()">🎓 شاشة المعلمة</button>
<div class="t-panel" id="tPanel">
  <div class="t-inner">
    <div style="display:flex;justify-content:space-between;margin-bottom:14px">
      <h2>🎓 نشاط 1 - متابعة الطالبات</h2>
      <div><button class="refresh-tp" onclick="loadT()">🔄</button><button class="close-tp" onclick="toggleT()">✕</button></div>
    </div>
    <div id="tStats"></div>
    <div id="tCards" class="t-grid"></div>
  </div>
</div>

<script>
const DB='https://cyber-safety-class-default-rtdb.firebaseio.com';
const PATH='robots-lesson/activity1';
const TOTAL=480,LV_TIME=60;
const STUDENTS=["أريام حميد الحبيني","أسيل موسى العوض","الجازي عبدالعزيز عبدالله محمد المنصورى","أمامه سليم علبي","أمنه هياب احمد عبدالرحمن","أنوار حمد العبيد","أنيسه نعمة الله","حبيبه علاء ابراهيم مشعل","حفصه احمد عبد المنعم عبد الغني","حلا أحمد محمد الباز عبدالعال","حنان محمد طاهر","حوريه نبيل احمد السيد الحفنى","داليا رمضان العلي","ذهب محمد طاهر","رغد نبي جول","رقية حمدى سعيد عباس خواجة","رنيم حسني عواد الخلايله","روقيه شعبان محمد هنداوي حسانين","رؤى بوكيوض","ريان محمود الحاج أمين نجار","ريتال حسني عواد الخلايله","شما عمر بشير عبدالقادر","فاطمه فخر الدين احمد الامين","قمر حازم عمر","ليا عبد الحاج اسماعيل","ماريا عبدالعليم الرزوق","مريم حافظ فاروق احمد احمد","ملاك عبدالله الدرويش","نداء حسين المحمد العبادي","نور أيهاب عبدالحميد عبدالسلام غمري","نورا عبدالعزيز عبدالله محمد المنصورى","نيللي أمير سعيد محمود الحداد","هنادي محمد عبدالله علي","هيلان","وعد مصطفى أحمد عثمان"];

let student='',level=0,totalTimer=null,lvTimer=null,lvSec=LV_TIME,totalSec=TOTAL;
let answers={l1:[],l2:[],l3:''};

// Words for level 1
const words=['آلة','تتفاعل','البيئة','برمجتها','مهام معينة','الحركة','حمل الأشياء'];
const blanks={b1:'تتفاعل',b2:'برمجتها',b3:'مهام معينة'};

window.onload=()=>{
  const s=document.getElementById('nameSelect');
  STUDENTS.forEach(n=>{const o=document.createElement('option');o.value=n;o.textContent=n;s.appendChild(o);});
};

function startAct(){
  const s=document.getElementById('nameSelect');
  if(!s.value){alert('اختاري اسمك');return;}
  student=s.value;
  document.getElementById('sName').textContent='👩‍🎓 '+student;
  showView('actView');
  renderLevel();
  startTotalTimer();
}

function showView(id){document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.getElementById(id).classList.add('active');}

function startTotalTimer(){
  totalTimer=setInterval(()=>{
    totalSec--;
    const m=Math.floor(totalSec/60),s=totalSec%60;
    const d=document.getElementById('timerDisplay');
    d.textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    if(totalSec<=60)d.classList.add('urgent');
    if(totalSec<=0){clearInterval(totalTimer);submitAll();}
  },1000);
}

function startLvTimer(){
  clearInterval(lvTimer);lvSec=LV_TIME;
  lvTimer=setInterval(()=>{
    lvSec--;
    document.getElementById('lvTimer').textContent='⏱ دقيقة للمستوى: '+lvSec+'ث';
    if(lvSec<=0){clearInterval(lvTimer);if(level<2)nextLevel();}
  },1000);
}

function renderLevel(){
  [0,1,2].forEach(i=>{
    const d=document.getElementById('dot'+i);
    d.className='lv-dot '+(i<level?'done':i===level?'active':'');
  });
  document.getElementById('lvBadge').textContent=`المستوى ${level+1} من 3 ${'★'.repeat(level+1)}`;
  const panel=document.getElementById('levelPanel');
  if(level===0) panel.innerHTML=renderL1();
  else if(level===1) panel.innerHTML=renderL2();
  else panel.innerHTML=renderL3();
  startLvTimer();
  setupDragDrop();
}

function renderL1(){
  const wordsHTML=words.map(w=>`<div class="word-chip" draggable="true" data-word="${w}" ondragstart="dragStart(event)">${w}</div>`).join('');
  return `<div class="level-title"><span class="badge">★ المستوى الأول</span><h3>ابني تعريف الروبوت بترتيب الكلمات المفتاحية</h3></div>
  <p style="color:#555;margin-bottom:10px">اسحبي الكلمات لمنطقة التعريف لبناء التعريف الصحيح:</p>
  <div class="word-bank" id="wordBank">${wordsHTML}</div>
  <p style="color:#888;font-size:0.9em;margin-bottom:6px">منطقة التعريف:</p>
  <div class="def-drop-zone" id="dropZone" ondragover="dragOver(event)" ondrop="dropWord(event)">
    <span class="static-text">الروبوت هو </span>
  </div>`;
}

function renderL2(){
  return `<div class="level-title"><span class="badge" style="background:linear-gradient(135deg,#f7971e,#ffd200)">★★ المستوى الثاني</span><h3>أكملي التعريف بالكلمات المناسبة</h3></div>
  <div class="def-text">
    الروبوت هو آلة <input class="blank-input" id="b1" placeholder="___"> مع البيئة الخارجية،
    ويتم <input class="blank-input" id="b2" placeholder="___"> لتقوم بمهام <input class="blank-input" id="b3" placeholder="___">,
    مثل الحركة، حمل الأشياء، أو المساعدة في الأعمال المنزلية.
  </div>
  <div class="hint-box">💡 تلميح: الكلمات المفتاحية هي: تتفاعل - برمجتها - معينة</div>`;
}

function renderL3(){
  return `<div class="level-title"><span class="badge" style="background:linear-gradient(135deg,#ee0979,#ff6a00)">★★★ المستوى الثالث</span><h3>اكتبي تعريف الروبوت بكلماتك الخاصة</h3></div>
  <p style="color:#555;margin-bottom:10px">بعد ما تعلمتِه، اكتبي تعريفاً خاصاً بك للروبوت. استخدمي الكلمات المفتاحية:</p>
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">
    ${['آلة','تتفاعل','برمجة','مهام','البيئة'].map(w=>`<span style="background:#D1FAE5;color:#065f46;border-radius:8px;padding:4px 12px;font-weight:700">${w}</span>`).join('')}
  </div>
  <textarea id="openDef" class="open-textarea" placeholder="الروبوت هو ..."></textarea>
  <div class="hint-box">💡 فكري: ما الذي يجعل الروبوت مختلفاً عن الأجهزة العادية؟</div>`;
}

function setupDragDrop(){} // Handled inline

let draggedWord=null;
function dragStart(e){draggedWord=e.target.dataset.word;e.target.classList.add('dragging');}
function dragOver(e){e.preventDefault();document.getElementById('dropZone').classList.add('drag-over');}
function dropWord(e){
  e.preventDefault();
  const zone=document.getElementById('dropZone');
  zone.classList.remove('drag-over');
  if(draggedWord){
    const placed=document.createElement('span');
    placed.className='placed-word';
    placed.textContent=draggedWord;
    placed.onclick=()=>{placed.remove();answers.l1=answers.l1.filter(w=>w!==draggedWord);}
    zone.appendChild(placed);
    answers.l1.push(draggedWord);
    // Remove from word bank
    document.querySelectorAll('.word-chip').forEach(c=>{if(c.dataset.word===draggedWord&&c.parentElement.id==='wordBank'){c.remove();}});
    draggedWord=null;
  }
}

function getL1Ans(){return answers.l1.join(' ');}
function getL2Ans(){return{b1:document.getElementById('b1')?.value||'',b2:document.getElementById('b2')?.value||'',b3:document.getElementById('b3')?.value||};}
function getL3Ans(){return document.getElementById('openDef')?.value||'';}

function scoreLevel(lv){
  if(lv===0){const ans=getL1Ans();answers.l1Saved=ans;return ans.includes('تتفاعل')&&ans.includes('برمجتها')?15:8;}
  if(lv===1){const a=getL2Ans();answers.l2Saved=a;const s=(a.b1.trim()==='تتفاعل'?1:0)+(a.b2.trim()==='برمجتها'?1:0)+(a.b3.includes('معين')?1:0);return s>=2?20:10;}
  if(lv===2){const v=getL3Ans();answers.l3=v;return v.length>30&&(v.includes('آلة')||v.includes('برمج')||v.includes('تتفاعل'))?30:15;}
  return 0;
}

let totalScore=0;
function nextLevel(){
  clearInterval(lvTimer);
  totalScore+=scoreLevel(level);
  level++;
  if(level>=3)submitAll();
  else renderLevel();
}

async function submitAll(){
  clearInterval(totalTimer);clearInterval(lvTimer);
  const key=encodeURIComponent(student.replace(/\s+/g,'_'));
  const data={name:student,level:level,score:totalScore,l1:answers.l1Saved||'',l2:JSON.stringify(answers.l2Saved||{}),l3:answers.l3,timestamp:Date.now()};
  try{
    await fetch(`${DB}/${PATH}/${key}.json`,{method:'PUT',body:JSON.stringify(data)});
    // Update total score
    const sc=await fetch(`${DB}/robots-lesson/scores/${key}.json`).then(r=>r.json()).catch(()=>({}));
    const newTotal=(sc?.total||0)+totalScore;
    await fetch(`${DB}/robots-lesson/scores/${key}.json`,{method:'PATCH',body:JSON.stringify({name:student,total:newTotal,act1:totalScore})});
  }catch(e){}
  document.getElementById('finalScore').textContent=`+${totalScore} نقطة!`;
  showView('successView');
}

function toggleT(){const p=document.getElementById('tPanel');p.classList.toggle('open');if(p.classList.contains('open'))loadT();}

async function loadT(){
  const cards=document.getElementById('tCards'),stats=document.getElementById('tStats');
  cards.innerHTML='<p style="color:#888;padding:20px;text-align:center">⏳ تحميل...</p>';
  const data=await fetch(`${DB}/${PATH}.json`).then(r=>r.json()).catch(()=>({}));
  const submitted=Object.values(data||{});
  const names=submitted.map(d=>d.name);
  const pending=STUDENTS.filter(s=>!names.includes(s));
  stats.innerHTML=`<span class="t-stat" style="color:#38ef7d;border:1px solid #38ef7d">✅ أرسلت: ${submitted.length}</span><span class="t-stat" style="color:#ffa500;border:1px solid #ffa500">⏳ بانتظار: ${pending.length}</span>`;
  cards.innerHTML='';
  submitted.sort((a,b)=>b.score-a.score).forEach((d,i)=>{
    cards.innerHTML+=`<div class="t-card done"><div class="t-name">${i<3?['🥇','🥈','🥉'][i]:''} ${d.name} <span class="t-status done-s">✅</span></div><div class="t-row">النقاط: <span>${d.score}</span></div><div class="t-row">المستوى: <span>${d.level}</span></div><div class="t-row">إجابة م3: <span>${d.l3?.slice(0,40)||'—'}</span></div></div>`;
  });
  pending.forEach(n=>{cards.innerHTML+=`<div class="t-card"><div class="t-name">${n} <span class="t-status pend-s">⏳</span></div></div>`;});
}
</script>
</body>
</html>
