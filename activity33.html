<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نشاط 3 - مكونات SPIKE PRIME</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Tajawal',sans-serif;background:#FFF0F5;min-height:100vh}
.top-bar{background:linear-gradient(135deg,#ee0979,#ff6a00);padding:12px 22px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 4px 15px rgba(238,9,121,0.4)}
.top-bar h1{color:#fff;font-size:1.3em;font-weight:900}
.timer-box{background:rgba(255,255,255,0.25);border:2px solid rgba(255,255,255,0.5);border-radius:12px;padding:7px 16px;color:#fff;font-size:1.5em;font-weight:900;min-width:76px;text-align:center}
.timer-box.urgent{background:rgba(220,38,38,0.35);border-color:#dc2626;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.6}}
.view{display:none}.view.active{display:block}
.center-screen{max-width:650px;margin:50px auto;padding:20px}
.card{background:#fff;border-radius:22px;padding:36px;box-shadow:0 10px 35px rgba(0,0,0,0.1);text-align:center}
.card .icon{font-size:4em;margin-bottom:12px}
.card h2{font-size:1.7em;font-weight:900;color:#1e3a5f;margin-bottom:8px}
.card p{color:#666;margin-bottom:20px}
select.name-sel{width:100%;padding:12px 16px;border:2px solid #ee0979;border-radius:12px;font-family:'Tajawal';font-size:1.05em;margin-bottom:16px}
.go-btn{background:linear-gradient(135deg,#ee0979,#ff6a00);color:#fff;border:none;border-radius:12px;padding:13px 36px;font-size:1.15em;font-family:'Tajawal';font-weight:800;cursor:pointer;width:100%}
.activity-area{max-width:1000px;margin:0 auto;padding:20px}
.student-bar{background:linear-gradient(135deg,#ee0979,#ff6a00);border-radius:12px;padding:10px 18px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;color:#fff}
.student-bar .sname{font-weight:800;font-size:1.05em}
.level-badge{background:rgba(255,255,255,0.25);border-radius:8px;padding:3px 14px;font-size:0.9em}
.levels-row{display:flex;gap:10px;margin-bottom:16px}
.lv-dot{flex:1;background:#e0e0e0;border-radius:10px;height:8px;transition:background 0.5s}
.lv-dot.done{background:#ee0979}
.lv-dot.active{background:#ffd200;animation:blink 1.2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.5}}
.level-panel{background:#fff;border-radius:20px;padding:24px;box-shadow:0 6px 22px rgba(0,0,0,0.08);min-height:300px}
.level-title{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.level-title .badge{background:linear-gradient(135deg,#ee0979,#ff6a00);color:#fff;border-radius:10px;padding:6px 18px;font-weight:800;font-size:0.95em}
.level-title h3{font-size:1.15em;color:#1e3a5f;font-weight:800}
/* Level 1: Component cards */
.comp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:16px}
.comp-card{background:#FFF0F5;border:2px dashed #ee0979;border-radius:16px;padding:16px;text-align:center;transition:background 0.3s}
.comp-card .comp-icon{font-size:2.5em;margin-bottom:8px}
.comp-card .comp-name{font-weight:800;color:#1e3a5f;font-size:1.1em;margin-bottom:8px}
.desc-zone{min-height:50px;border:2px dashed #ccc;border-radius:10px;padding:8px;font-size:0.85em;color:#555;background:#fafafa;cursor:pointer}
.desc-zone.filled{background:#FFF0F5;border-color:#ee0979;color:#9c004e;font-weight:700}
.desc-zone.drag-over{background:#FFE0EE;border-color:#ee0979}
.desc-cards{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px;padding:14px;background:#FFF9FC;border:2px dashed #ee0979;border-radius:12px;min-height:60px}
.desc-chip{background:#ee0979;color:#fff;border-radius:14px;padding:8px 16px;cursor:grab;font-weight:700;font-size:0.9em;user-select:none;transition:transform 0.2s}
.desc-chip:hover{transform:scale(1.04)}
.desc-chip.dragging{opacity:0.5}
/* Level 2: classify */
.classify-area{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:16px}
.classify-box{background:#fff;border:2px solid #ee0979;border-radius:14px;padding:14px;min-height:120px}
.classify-box h4{color:#ee0979;font-weight:800;text-align:center;margin-bottom:10px;font-size:0.95em;padding-bottom:8px;border-bottom:2px solid #FFF0F5}
.classify-drop{min-height:80px;display:flex;flex-direction:column;gap:6px}
.classify-drop.drag-over{background:#FFF0F5;border-radius:8px}
.items-pool{display:flex;flex-wrap:wrap;gap:8px;padding:12px;background:#FFF9FC;border:2px dashed #ee0979;border-radius:12px;margin-bottom:14px}
.item-chip{background:linear-gradient(135deg,#ee0979,#ff6a00);color:#fff;border-radius:12px;padding:7px 14px;cursor:grab;font-weight:700;font-size:0.88em;user-select:none}
.item-chip.dragging{opacity:0.5}
.placed-item{background:#FFF0F5;border:2px solid #ee0979;color:#9c004e;border-radius:10px;padding:5px 12px;font-weight:700;font-size:0.85em;cursor:pointer}
/* Level 3: open text */
.spike-summary{background:linear-gradient(135deg,#FFF0F5,#FFE0EE);border-radius:14px;padding:16px;margin-bottom:16px;border:1px solid #ee0979}
.spike-summary p{color:#555;font-size:0.95em;line-height:1.8;margin-bottom:6px}
.spike-summary strong{color:#ee0979}
.open-textarea{width:100%;padding:14px;border:2px solid #ee0979;border-radius:12px;font-family:'Tajawal';font-size:1.05em;min-height:130px;resize:vertical;direction:rtl}
.open-textarea:focus{outline:none;border-color:#ff6a00}
.hint-box{background:#FFF0F5;border:1px solid #ee0979;border-radius:10px;padding:10px 14px;margin-top:10px;color:#9c004e;font-size:0.9em}
.action-row{display:flex;justify-content:space-between;align-items:center;margin-top:20px;gap:12px}
.next-btn{background:linear-gradient(135deg,#ee0979,#ff6a00);color:#fff;border:none;border-radius:12px;padding:12px 30px;font-size:1.05em;font-family:'Tajawal';font-weight:800;cursor:pointer;flex:1}
.skip-btn{background:#f5f5f5;color:#888;border:none;border-radius:12px;padding:12px 20px;font-family:'Tajawal';font-weight:700;cursor:pointer;font-size:0.95em}
.level-timer{color:#888;font-size:0.9em}
.success-area{max-width:560px;margin:60px auto;text-align:center;padding:20px}
.success-card{background:#fff;border-radius:22px;padding:40px;box-shadow:0 10px 35px rgba(0,0,0,0.1)}
.score-big{background:linear-gradient(135deg,#ee0979,#ff6a00);color:#fff;border-radius:14px;padding:14px 40px;font-size:1.5em;font-weight:900;display:inline-block;margin:14px 0}
.teacher-toggle{position:fixed;bottom:20px;left:20px;background:#1a1a2e;color:#fff;border:2px solid #ff6a00;border-radius:12px;padding:10px 18px;font-family:'Tajawal';cursor:pointer;font-weight:700;z-index:100}
.t-panel{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.82);z-index:200;display:none;overflow-y:auto}
.t-panel.open{display:block}
.t-inner{background:#0f172a;min-height:100vh;padding:24px}
.t-inner h2{color:#ff6a00;font-size:1.4em;margin-bottom:18px}
.close-tp{background:#dc2626;color:#fff;border:none;border-radius:10px;padding:8px 18px;font-family:'Tajawal';cursor:pointer;float:left;font-weight:700}
.refresh-tp{background:#4776E6;color:#fff;border:none;border-radius:10px;padding:8px 18px;font-family:'Tajawal';cursor:pointer;font-weight:700;margin-right:10px}
.t-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-top:14px}
.t-card{background:#16213e;border-radius:12px;padding:14px;border:1px solid #333}
.t-card.done{border-color:#ff6a00}
.t-name{color:#ffd200;font-weight:800;font-size:0.9em;margin-bottom:6px}
.t-row{color:#aaa;font-size:0.8em;margin-bottom:3px}
.t-row span{color:#ddd}
.t-status{font-size:0.75em;padding:2px 10px;border-radius:8px;display:inline-block}
.done-s{background:rgba(255,106,0,0.2);color:#ff6a00}
.pend-s{background:rgba(255,165,0,0.12);color:#ffa500}
.t-stat{background:#16213e;border-radius:10px;padding:8px 16px;font-weight:800;display:inline-block;margin-left:10px;margin-bottom:12px}
</style>
</head>
<body>
<div class="top-bar">
  <h1>🧩 نشاط 3 - مكونات LEGO SPIKE PRIME | ثنائي</h1>
  <div id="timerDisplay" class="timer-box">08:00</div>
</div>

<div id="nameView" class="view active">
  <div class="center-screen"><div class="card">
    <div class="icon">🧩</div>
    <h2>اكتشاف مكونات الروبوت</h2>
    <p>ستعملين مع شريكتك لاكتشاف مكونات روبوت LEGO SPIKE PRIME عبر ثلاثة مستويات!</p>
    <select id="nameSelect" class="name-sel"><option value="">-- اختاري اسمك --</option></select>
    <button class="go-btn" onclick="startAct()">🚀 ابدئي النشاط</button>
  </div></div>
</div>

<div id="actView" class="view">
  <div class="activity-area">
    <div class="student-bar">
      <span class="sname" id="sName"></span>
      <span class="level-badge" id="lvBadge">المستوى 1 من 3</span>
    </div>
    <div class="levels-row">
      <div class="lv-dot active" id="dot0"></div>
      <div class="lv-dot" id="dot1"></div>
      <div class="lv-dot" id="dot2"></div>
    </div>
    <div class="level-panel" id="levelPanel"></div>
    <div class="action-row">
      <span class="level-timer" id="lvTimer">⏱ دقيقة للمستوى</span>
      <button class="skip-btn" onclick="nextLevel()">تخطي ←</button>
      <button class="next-btn" id="nextBtn" onclick="nextLevel()">التالي ←</button>
    </div>
  </div>
</div>

<div id="successView" class="view">
  <div class="success-area"><div class="success-card">
    <div style="font-size:3.5em;margin-bottom:12px">🎉</div>
    <h2 style="color:#ee0979;font-size:1.8em;margin-bottom:8px">رائع جداً!</h2>
    <div class="score-big" id="finalScore">+25 نقطة!</div>
    <p style="color:#555">تم حفظ إجاباتك. انتظري تعليمات المعلمة.</p>
    <a href="index.html" style="display:inline-block;margin-top:16px;color:#ee0979;font-weight:700">← العودة للقائمة</a>
  </div></div>
</div>

<button class="teacher-toggle" onclick="toggleT()">🎓 شاشة المعلمة</button>
<div class="t-panel" id="tPanel">
  <div class="t-inner">
    <div style="display:flex;justify-content:space-between;margin-bottom:14px">
      <h2>🎓 نشاط 3 - متابعة الطالبات</h2>
      <div><button class="refresh-tp" onclick="loadT()">🔄 تحديث</button><button class="close-tp" onclick="toggleT()">✕ إغلاق</button></div>
    </div>
    <div id="tStats"></div>
    <div id="tCards" class="t-grid"></div>
  </div>
</div>

<script>
const DB='https://cyber-safety-class-default-rtdb.firebaseio.com';
const PATH='robots-lesson/activity3';
const TOTAL=480,LV_TIME=60;
const STUDENTS=["أريام حميد الحبيني","أسيل موسى العوض","الجازي عبدالعزيز عبدالله محمد المنصورى","أمامه سليم علبي","أمنه هياب احمد عبدالرحمن","أنوار حمد العبيد","أنيسه نعمة الله","حبيبه علاء ابراهيم مشعل","حفصه احمد عبد المنعم عبد الغني","حلا أحمد محمد الباز عبدالعال","حنان محمد طاهر","حوريه نبيل احمد السيد الحفنى","داليا رمضان العلي","ذهب محمد طاهر","رغد نبي جول","رقية حمدى سعيد عباس خواجة","رنيم حسني عواد الخلايله","روقيه شعبان محمد هنداوي حسانين","رؤى بوكيوض","ريان محمود الحاج أمين نجار","ريتال حسني عواد الخلايله","شما عمر بشير عبدالقادر","فاطمه فخر الدين احمد الامين","قمر حازم عمر","ليا عبد الحاج اسماعيل","ماريا عبدالعليم الرزوق","مريم حافظ فاروق احمد احمد","ملاك عبدالله الدرويش","نداء حسين المحمد العبادي","نور أيهاب عبدالحميد عبدالسلام غمري","نورا عبدالعزيز عبدالله محمد المنصورى","نيللي أمير سعيد محمود الحداد","هنادي محمد عبدالله علي","هيلان","وعد مصطفى أحمد عثمان"];

let student='',level=0,totalTimer=null,lvTimer=null,lvSec=LV_TIME,totalSec=TOTAL;
let answers={l1:{},l2:{},l3:''};
let dragSrc=null;

// Level 1 data
const descs=[
  {id:'d1',text:'وحدة التحكم الرئيسية في الروبوت وتحتوي على شاشة LED',comp:'Spike Hub'},
  {id:'d2',text:'تتحرك وتدير أجزاء الروبوت مثل الذراع والعجلات',comp:'Motors'},
  {id:'d3',text:'تستشعر البيئة وترسل معلومات لوحدة التحكم',comp:'Sensors'},
];
const comps=[
  {name:'Spike Hub',icon:'🖥️'},
  {name:'Motors',icon:'⚙️'},
  {name:'Sensors',icon:'📡'},
];
// Level 2 data
const classifyItems=['شاشة LED','زر التشغيل','المحرك المتوسط','المحرك الكبير','مستشعر اللون','مستشعر المسافة','مستشعر القوة','الدوران الجيرو','منافذ A-F','Bluetooth'];
const classifyAnswer={
  'Spike Hub':['شاشة LED','زر التشغيل','منافذ A-F','Bluetooth'],
  'Motors':['المحرك المتوسط','المحرك الكبير'],
  'Sensors':['مستشعر اللون','مستشعر المسافة','مستشعر القوة','الدوران الجيرو'],
};

window.onload=()=>{
  const s=document.getElementById('nameSelect');
  STUDENTS.forEach(n=>{const o=document.createElement('option');o.value=n;o.textContent=n;s.appendChild(o);});
};

function startAct(){
  const s=document.getElementById('nameSelect');
  if(!s.value){alert('اختاري اسمك');return;}
  student=s.value;
  document.getElementById('sName').textContent='👩‍🎓 '+student;
  showView('actView');
  renderLevel();
  startTotalTimer();
}

function showView(id){document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.getElementById(id).classList.add('active');}

function startTotalTimer(){
  totalTimer=setInterval(()=>{
    totalSec--;
    const m=Math.floor(totalSec/60),s=totalSec%60;
    const d=document.getElementById('timerDisplay');
    d.textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    if(totalSec<=60)d.classList.add('urgent');
    if(totalSec<=0){clearInterval(totalTimer);submitAll();}
  },1000);
}

function startLvTimer(){
  clearInterval(lvTimer);lvSec=LV_TIME;
  lvTimer=setInterval(()=>{
    lvSec--;
    document.getElementById('lvTimer').textContent='⏱ دقيقة للمستوى: '+lvSec+'ث';
    if(lvSec<=0){clearInterval(lvTimer);if(level<2)nextLevel();}
  },1000);
}

function renderLevel(){
  [0,1,2].forEach(i=>{
    const d=document.getElementById('dot'+i);
    d.className='lv-dot '+(i<level?'done':i===level?'active':'');
  });
  document.getElementById('lvBadge').textContent=`المستوى ${level+1} من 3 ${'★'.repeat(level+1)}`;
  const panel=document.getElementById('levelPanel');
  if(level===0) panel.innerHTML=renderL1();
  else if(level===1) panel.innerHTML=renderL2();
  else panel.innerHTML=renderL3();
  initDrag();
  startLvTimer();
}

function renderL1(){
  const shuffled=[...descs].sort(()=>Math.random()-0.5);
  return `
  <div class="level-title"><span class="badge">⭐ المستوى 1</span><h3>طابقي كل مكوّن مع وصفه (سحب وإفلات)</h3></div>
  <p style="color:#888;font-size:0.9em;margin-bottom:14px">📌 اسحبي كل وصف وضعيه في البطاقة المناسبة</p>
  <div class="desc-cards" id="descPool">
    ${shuffled.map(d=>`<div class="desc-chip" id="${d.id}" draggable="true">${d.text}</div>`).join('')}
  </div>
  <div class="comp-grid">
    ${comps.map(c=>`
    <div class="comp-card">
      <div class="comp-icon">${c.icon}</div>
      <div class="comp-name">${c.name}</div>
      <div class="desc-zone" id="zone_${c.name}" ondragover="event.preventDefault();this.classList.add('drag-over')" ondragleave="this.classList.remove('drag-over')" ondrop="dropDesc(event,'${c.name}')">
        أفلتي الوصف هنا
      </div>
    </div>`).join('')}
  </div>`;
}

function renderL2(){
  const shuffled=[...classifyItems].sort(()=>Math.random()-0.5);
  return `
  <div class="level-title"><span class="badge">⭐⭐ المستوى 2</span><h3>صنّفي العناصر إلى مجموعاتها الصحيحة</h3></div>
  <div class="items-pool" id="itemPool">
    ${shuffled.map(item=>`<div class="item-chip" id="item_${item.replace(/\s/g,'_')}" draggable="true">${item}</div>`).join('')}
  </div>
  <div class="classify-area">
    ${['Spike Hub','Motors','Sensors'].map((cat,i)=>`
    <div class="classify-box">
      <h4>${['🖥️ Spike Hub','⚙️ Motors','📡 Sensors'][i]}</h4>
      <div class="classify-drop" id="cat_${cat}" ondragover="event.preventDefault();this.classList.add('drag-over')" ondragleave="this.classList.remove('drag-over')" ondrop="dropItem(event,'${cat}')"></div>
    </div>`).join('')}
  </div>`;
}

function renderL3(){
  return `
  <div class="level-title"><span class="badge">⭐⭐⭐ المستوى 3</span><h3>اشرحي دور كل مكوّن بكلماتك الخاصة</h3></div>
  <div class="spike-summary">
    <p>🔹 <strong>Spike Hub:</strong> وحدة التحكم التي تُشغّل الروبوت وتحتوي على شاشة ومفاتيح ومنافذ</p>
    <p>🔹 <strong>Motors:</strong> تتصل بـ Spike Hub وتُحرّك الروبوت</p>
    <p>🔹 <strong>Sensors:</strong> يمكن وصلها لتستشعر البيئة المحيطة</p>
  </div>
  <p style="color:#555;margin-bottom:10px;font-weight:700">💡 اكتبي: لماذا يحتاج الروبوت للمكونات الثلاثة معاً؟ ما الذي يحدث لو غابت إحداها؟</p>
  <textarea class="open-textarea" id="openAns3" placeholder="اكتبي إجابتك هنا... فكّري بشكل إبداعي!"></textarea>
  <div class="hint-box">💡 تلميح: فكّري في مثال من الحياة مثل الإنسان: الجسم مثل الروبوت، العقل مثل Spike Hub، اليدان مثل المحركات، والحواس مثل المستشعرات.</div>`;
}

function initDrag(){
  setTimeout(()=>{
    document.querySelectorAll('.desc-chip').forEach(chip=>{
      chip.addEventListener('dragstart',e=>{dragSrc=chip;chip.classList.add('dragging');});
      chip.addEventListener('dragend',()=>chip.classList.remove('dragging'));
    });
    document.querySelectorAll('.item-chip').forEach(chip=>{
      chip.addEventListener('dragstart',e=>{dragSrc=chip;chip.classList.add('dragging');});
      chip.addEventListener('dragend',()=>chip.classList.remove('dragging'));
    });
    document.querySelectorAll('.placed-item').forEach(p=>{
      p.addEventListener('click',()=>{
        const cat=p.dataset.cat;
        const zone=document.getElementById('cat_'+cat);
        const pool=document.getElementById('itemPool');
        if(pool){
          const chip=document.createElement('div');
          chip.className='item-chip';
          chip.id='item_'+p.textContent.trim().replace(/\s/g,'_');
          chip.draggable=true;
          chip.textContent=p.textContent;
          chip.addEventListener('dragstart',e=>{dragSrc=chip;chip.classList.add('dragging');});
          chip.addEventListener('dragend',()=>chip.classList.remove('dragging'));
          pool.appendChild(chip);
          if(answers.l2[cat]) answers.l2[cat]=answers.l2[cat].filter(x=>x!==p.textContent);
          p.remove();
        }
      });
    });
  },50);
}

function dropDesc(event,compName){
  event.preventDefault();
  document.getElementById('zone_'+compName).classList.remove('drag-over');
  if(!dragSrc) return;
  const zone=document.getElementById('zone_'+compName);
  const existing=zone.querySelector('.desc-chip');
  if(existing){
    document.getElementById('descPool').appendChild(existing);
    existing.draggable=true;
  }
  zone.innerHTML='';
  dragSrc.classList.remove('dragging');
  dragSrc.style.cursor='default';
  zone.classList.add('filled');
  zone.textContent=dragSrc.textContent;
  answers.l1[compName]=dragSrc.textContent;
  dragSrc.remove();
  dragSrc=null;
}

function dropItem(event,cat){
  event.preventDefault();
  document.getElementById('cat_'+cat).classList.remove('drag-over');
  if(!dragSrc) return;
  const zone=document.getElementById('cat_'+cat);
  const placed=document.createElement('div');
  placed.className='placed-item';
  placed.dataset.cat=cat;
  placed.textContent=dragSrc.textContent;
  if(!answers.l2[cat]) answers.l2[cat]=[];
  answers.l2[cat].push(dragSrc.textContent);
  zone.appendChild(placed);
  dragSrc.remove();
  dragSrc=null;
  initDrag();
}

function nextLevel(){
  clearInterval(lvTimer);
  if(level===2){
    answers.l3=document.getElementById('openAns3')?.value||'';
    submitAll();
  } else {
    level++;
    renderLevel();
  }
}

async function submitAll(){
  clearInterval(totalTimer);clearInterval(lvTimer);
  let score=15;
  if(Object.keys(answers.l1).length>=3) score+=10;
  if(Object.keys(answers.l2).length>=3) score+=10;
  if(answers.l3&&answers.l3.length>15) score+=5;
  const timebonus=totalSec>300?5:totalSec>180?3:0;
  score+=timebonus;
  const key=encodeURIComponent(student.replace(/\s+/g,'_'));
  const data={name:student,score,l1:JSON.stringify(answers.l1),l2:JSON.stringify(answers.l2),l3:answers.l3,timestamp:Date.now()};
  try{
    await fetch(`${DB}/${PATH}/${key}.json`,{method:'PUT',body:JSON.stringify(data)});
    await fetch(`${DB}/robots-lesson/scores/${key}/act3.json`,{method:'PUT',body:JSON.stringify(score)});
    await fetch(`${DB}/robots-lesson/scores/${key}/name.json`,{method:'PUT',body:JSON.stringify(student)});
  }catch(e){}
  document.getElementById('finalScore').textContent=`+${score} نقطة! 🎉`;
  showView('successView');
}

function toggleT(){document.getElementById('tPanel').classList.toggle('open');loadT();}
async function loadT(){
  try{
    const r=await fetch(`${DB}/${PATH}.json`);
    const data=await r.json()||{};
    const done=Object.values(data);
    const total=STUDENTS.length;
    document.getElementById('tStats').innerHTML=`
    <div>
      <span class="t-stat" style="color:#ff6a00">✅ أكملن: ${done.length}</span>
      <span class="t-stat" style="color:#ffa500">⏳ لم يكملن: ${total-done.length}</span>
      <span class="t-stat" style="color:#ffd200">📊 المجموع: ${total}</span>
    </div>`;
    const names=done.map(d=>d.name);
    const missing=STUDENTS.filter(s=>!names.includes(s));
    let html=done.sort((a,b)=>(b.score||0)-(a.score||0)).map(d=>`
    <div class="t-card done">
      <div class="t-name">✅ ${d.name}</div>
      <div class="t-row">النقاط: <span>${d.score}</span></div>
      <div class="t-row">مست3: <span>${d.l3?d.l3.substring(0,40)+'...':'-'}</span></div>
    </div>`).join('');
    html+=missing.map(n=>`
    <div class="t-card">
      <div class="t-name">⏳ ${n}</div>
      <span class="t-status pend-s">لم تبدأ</span>
    </div>`).join('');
    document.getElementById('tCards').innerHTML=html;
  }catch(e){document.getElementById('tCards').innerHTML='<p style="color:#aaa">خطأ في التحميل</p>';}
}
</script>
