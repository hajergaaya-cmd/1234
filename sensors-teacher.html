<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>شاشة المعلمة — اكتشاف المستشعرات</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0e1a;--card:#131929;--card2:#1a2236;--border:rgba(255,255,255,.08);
  --gyro:#8B5CF6;--color:#EC4899;--dist:#06B6D4;--force:#F59E0B;
  --green:#10B981;--red:#EF4444;--yellow:#FFD60A;
  --text:#F1F5F9;--muted:#94A3B8;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Tajawal',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
body::before{content:'';position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 20% 20%,rgba(139,92,246,.08) 0%,transparent 50%),
             radial-gradient(ellipse at 80% 80%,rgba(6,182,212,.08) 0%,transparent 50%);z-index:0}

/* HEADER */
.header{
  background:linear-gradient(135deg,#1a1040,#0e1a30);
  border-bottom:1px solid rgba(139,92,246,.25);
  padding:14px 28px;display:flex;justify-content:space-between;align-items:center;position:relative;z-index:10
}
.header h1{
  font-size:1.3em;font-weight:900;
  background:linear-gradient(90deg,#a78bfa,#38bdf8,#34d399);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent
}
.hsub{color:var(--muted);font-size:.87em;margin-top:3px;display:flex;align-items:center;gap:8px}
.ldot{width:8px;height:8px;background:var(--green);border-radius:50%;display:inline-block;animation:blink 1.2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
.rbtn{
  background:rgba(139,92,246,.2);color:#a78bfa;
  border:1px solid rgba(139,92,246,.4);border-radius:10px;
  padding:8px 18px;font-family:'Tajawal',sans-serif;font-size:.9em;font-weight:800;cursor:pointer
}
.rbtn:hover{background:rgba(139,92,246,.35)}

/* SUMMARY */
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:18px 28px;position:relative;z-index:1}
.sb{
  background:var(--card);border:1px solid var(--border);border-radius:16px;
  padding:16px 14px;text-align:center
}
.sn{font-size:2.3em;font-weight:900;line-height:1;margin-bottom:3px}
.sl{font-size:.82em;color:var(--muted);font-weight:600}

/* PROGRESS BAR */
.prog-sec{padding:0 28px 18px;position:relative;z-index:1}
.pl{display:flex;justify-content:space-between;font-size:.86em;color:var(--muted);margin-bottom:6px}
.pb{background:rgba(255,255,255,.08);border-radius:10px;height:12px;overflow:hidden}
.pf{height:100%;border-radius:10px;background:linear-gradient(90deg,var(--gyro),var(--dist),var(--green));transition:width .5s}

/* PODIUM */
.section{padding:0 28px 22px;position:relative;z-index:1}
.stitle{font-size:1.05em;font-weight:800;margin-bottom:12px;
  background:linear-gradient(90deg,#ffd700,#ff9500);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.podium{display:flex;gap:12px;flex-wrap:wrap}
.pod{flex:1;min-width:150px;border-radius:18px;padding:16px 12px;text-align:center;border:1px solid var(--border)}
.pod-1{background:linear-gradient(135deg,#2d1b00,#4a2e00);border-color:#b8860b}
.pod-2{background:linear-gradient(135deg,#1a1040,#2d1b69);border-color:#6040c0}
.pod-3{background:linear-gradient(135deg,#0a2030,#0e3040);border-color:#206080}
.pod .pm{font-size:1.9em;margin-bottom:5px}
.pod .pn{font-weight:800;font-size:.88em;color:#fff;margin-bottom:5px}
.pod .ps{font-size:1.4em;font-weight:900;color:var(--yellow)}

/* TABS */
.tabs{display:flex;gap:9px;padding:0 28px 14px;flex-wrap:wrap;position:relative;z-index:1}
.tab{background:var(--card2);border:1px solid var(--border);border-radius:10px;
  padding:7px 16px;color:var(--muted);font-family:'Tajawal',sans-serif;font-size:.9em;font-weight:700;cursor:pointer}
.tab.on{background:rgba(139,92,246,.3);border-color:var(--gyro);color:#a78bfa}
.tc{display:none;position:relative;z-index:1}.tc.on{display:block}

/* FILTER */
.filter-row{display:flex;gap:8px;padding:0 28px 12px;flex-wrap:wrap}
.ftab{background:var(--card2);border:1px solid var(--border);border-radius:10px;
  padding:5px 14px;color:var(--muted);font-family:'Tajawal',sans-serif;font-size:.88em;font-weight:700;cursor:pointer}
.ftab.on{background:rgba(16,185,129,.2);border-color:var(--green);color:var(--green)}

/* STUDENT GRID */
.std-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:9px;padding:0 28px 28px}
.std-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:13px 14px}
.std-card.done{border-color:rgba(16,185,129,.4)}
.std-card.pend{opacity:.45}
.sc-top{display:flex;align-items:center;gap:9px;margin-bottom:8px}
.sc-ico{font-size:1.5em}
.sc-name{font-weight:700;font-size:.86em;color:var(--text);line-height:1.3}
.sc-score{font-size:.8em;font-weight:800;margin-top:2px;color:var(--yellow)}
/* sensor result dots */
.sensor-dots{display:flex;gap:4px;margin-top:5px}
.sdot{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.72em;border:1.5px solid rgba(255,255,255,.1)}
.sdot.ok{border-color:var(--green);background:rgba(16,185,129,.2)}
.sdot.err{border-color:var(--red);background:rgba(239,68,68,.15)}
.sdot.blank{background:rgba(255,255,255,.05)}

/* SENSOR ANALYSIS */
.an-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;padding:0 28px 28px}
.an-card{border-radius:18px;padding:18px;border:1px solid var(--border)}
.an-card h3{font-size:1em;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.an-stat{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}
.an-lbl{font-size:.82em;color:var(--muted)}
.an-val{font-size:.9em;font-weight:800}
.an-bar{background:rgba(255,255,255,.08);border-radius:6px;height:7px;margin-top:3px;overflow:hidden}
.an-fill{height:100%;border-radius:6px;transition:.4s}

/* RESET */
.reset-sec{padding:0 28px 28px}
.reset-box{background:#1a0505;border:2px dashed var(--red);border-radius:16px;
  padding:28px;text-align:center;max-width:400px;margin:0 auto}
.reset-box h3{color:#ef4444;font-size:1.1em;font-weight:900;margin-bottom:8px}
.reset-box p{color:var(--muted);font-size:.9em;line-height:1.6;margin-bottom:16px}
.reset-box p strong{color:#ef4444}
.reset-btn{background:var(--red);color:#fff;border:none;border-radius:11px;
  padding:11px 28px;font-family:'Tajawal',sans-serif;font-size:1em;font-weight:900;cursor:pointer}

.loading{text-align:center;padding:36px;color:var(--muted)}
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>🔬 شاشة المعلمة — اكتشاف المستشعرات</h1>
    <div class="hsub"><span class="ldot"></span> بيانات حية • تحديث كل 15 ثانية</div>
  </div>
  <button class="rbtn" onclick="loadData()">🔄 تحديث</button>
</div>

<!-- SUMMARY -->
<div class="summary">
  <div class="sb"><div class="sn" style="color:var(--gyro)">33</div><div class="sl">الطالبات</div></div>
  <div class="sb"><div class="sn" id="numDone" style="color:var(--green)">—</div><div class="sl">أكملن النشاط</div></div>
  <div class="sb"><div class="sn" id="avgScore" style="color:var(--yellow)">—</div><div class="sl">متوسط النقاط</div></div>
  <div class="sb"><div class="sn" id="topScore" style="color:#F472B6">—</div><div class="sl">أعلى نقاط</div></div>
</div>

<!-- PROGRESS -->
<div class="prog-sec">
  <div class="pl"><span>نسبة الإنجاز</span><span id="progPct">0%</span></div>
  <div class="pb"><div class="pf" id="progFill" style="width:0%"></div></div>
</div>

<!-- PODIUM -->
<div class="section">
  <div class="stitle">🏆 المتصدرات</div>
  <div class="podium" id="podRow"><div class="loading">جارٍ التحميل...</div></div>
</div>

<!-- TABS -->
<div class="tabs">
  <button class="tab on" onclick="swTab('students',this)">👩‍🎓 الطالبات</button>
  <button class="tab" onclick="swTab('sensors',this)">📊 تحليل المستشعرات</button>
  <button class="tab" style="border-color:rgba(239,68,68,.4);color:#f87171" onclick="swTab('reset',this)">🗑️ مسح</button>
</div>

<!-- STUDENTS TAB -->
<div class="tc on" id="tc-students">
  <div class="filter-row">
    <button class="ftab on" onclick="setF('all',this)">الكل</button>
    <button class="ftab" onclick="setF('done',this)">✅ أكملن</button>
    <button class="ftab" onclick="setF('pend',this)">⏳ لم تكملن</button>
  </div>
  <div class="std-grid" id="stdGrid"><div class="loading">جارٍ التحميل...</div></div>
</div>

<!-- SENSORS TAB -->
<div class="tc" id="tc-sensors">
  <div class="an-grid" id="anGrid"><div class="loading" style="grid-column:span 2">جارٍ التحميل...</div></div>
</div>

<!-- RESET TAB -->
<div class="tc" id="tc-reset">
  <div class="reset-sec">
    <div class="reset-box">
      <h3>⚠️ مسح نتائج النشاط</h3>
      <p>سيتم حذف جميع بيانات نشاط اكتشاف المستشعرات.<br><strong>لا يمكن التراجع.</strong></p>
      <button class="reset-btn" onclick="resetAct()">🗑️ مسح الكل</button>
    </div>
  </div>
</div>

<script>
const DB   = 'https://cyber-safety-class-default-rtdb.firebaseio.com';
const PATH = 'robots-lesson/sensors-discovery';
const TOTAL= 33;
const STUDENTS=['أريام حميد الحبيني','اسيل موسى العوض','الجازي عبدالعزيز عبدالله محمد المنصورى','امامه سليم علبي','امنه هياب احمد عبدالرحمن','انوار حمد العبيد','انيسه نعمة الله','حبيبه علاء ابراهيم مشعل','حفصه احمد عبد المنعم عبد الغني','حلا أحمد محمد الباز عبدالعال','حنان محمد طاهر','داليا رمضان العلي','ذهب محمد طاهر','رغد نبي جول','رقية حمدى سعيد عباس خواجة','رنيم حسني عواد الخلايله','روقيه شعبان محمد هنداوي حسانين','رؤى بوكيوض','ريان محمود الحاج أمين نجار','ريتال حسني عواد الخلايله','شما عمر بشير عبدالقادر','فاطمه فخر الدين احمد الامين','قمر حازم عمر','ليا عبد الحاج اسماعيل','ماريا عبدالعليم الرزوق','مريم حافظ فاروق احمد احمد','ملاك عبدالله الدرويش','نداء حسين المحمد العبادي','نور أيهاب عبدالحميد عبدالسلام غمري','نورا عبدالعزيز عبدالله محمد المنصورى','نيللي أمير سعيد محمود الحداد','هنادي محمد عبدالله علي هيلان','وعد مصطفى أحمد عثمان'];

const SENSOR_COLORS={gyro:'var(--gyro)',color:'var(--color)',dist:'var(--dist)',force:'var(--force)'};
const SENSOR_EMOJIS={gyro:'🌀',color:'🎨',dist:'📏',force:'✊'};
const SENSOR_NAMES={gyro:'مستشعر الدوران',color:'مستشعر الألوان',dist:'مستشعر المسافة',force:'مستشعر القوة'};

let fm='all', cache={};

async function loadData(){
  try{
    const r=await fetch(`${DB}/${PATH}.json`);
    cache=await r.json()||{};
    render();
  }catch(e){console.error(e);}
}

function render(){
  const done=Object.values(cache).filter(d=>d&&d.name);
  const names=done.map(d=>d.name);
  const pend=STUDENTS.filter(n=>!names.includes(n));
  const avg=done.length?Math.round(done.reduce((s,d)=>s+(d.score||0),0)/done.length):0;
  const top=done.length?Math.max(...done.map(d=>d.score||0)):0;

  document.getElementById('numDone').textContent=done.length;
  document.getElementById('avgScore').textContent=avg;
  document.getElementById('topScore').textContent=top;
  const pct=Math.round(done.length/TOTAL*100);
  document.getElementById('progPct').textContent=pct+'%';
  document.getElementById('progFill').style.width=pct+'%';

  // Podium
  const sorted=[...done].sort((a,b)=>(b.score||0)-(a.score||0));
  const medals=['🥇','🥈','🥉'],pcls=['pod-1','pod-2','pod-3'];
  document.getElementById('podRow').innerHTML=
    sorted.slice(0,3).map((s,i)=>`
      <div class="pod ${pcls[i]}"><div class="pm">${medals[i]}</div>
      <div class="pn">${s.name.split(' ').slice(0,2).join(' ')}</div>
      <div class="ps">⭐ ${s.score}</div></div>`).join('') ||
    '<p style="color:var(--muted)">لا توجد بيانات بعد</p>';

  renderGrid(done,pend);
  renderAnalysis(done);
}

function getSensorResults(student){
  if(!student.results) return {};
  const out={};
  student.results.forEach(r=>{out[r.sensor]=r.correct;});
  return out;
}

function renderGrid(done,pend){
  const doneL=done.sort((a,b)=>b.score-a.score).map(d=>({...d,isDone:true}));
  const pendL=pend.map(n=>({name:n,isDone:false}));
  let list=fm==='done'?doneL:fm==='pend'?pendL:[...doneL,...pendL];
  const ORDER=['gyro','color','dist','force'];

  document.getElementById('stdGrid').innerHTML=list.map(s=>{
    if(!s.isDone) return `<div class="std-card pend">
      <div class="sc-top"><div class="sc-ico">⏳</div>
      <div><div class="sc-name">${s.name}</div><div class="sc-score" style="color:var(--muted)">لم تبدأ</div></div></div>
      <div class="sensor-dots">${ORDER.map(id=>`<div class="sdot blank">${SENSOR_EMOJIS[id]}</div>`).join('')}</div>
    </div>`;
    const sr=getSensorResults(s);
    return `<div class="std-card done">
      <div class="sc-top"><div class="sc-ico">✅</div>
      <div><div class="sc-name">${s.name.split(' ').slice(0,2).join(' ')}</div>
      <div class="sc-score">⭐ ${s.score}</div></div></div>
      <div class="sensor-dots">
        ${ORDER.map(id=>`<div class="sdot ${sr[id]===true?'ok':sr[id]===false?'err':'blank'}" title="${SENSOR_NAMES[id]}">${SENSOR_EMOJIS[id]}</div>`).join('')}
      </div>
    </div>`;
  }).join('')||'<p style="color:var(--muted);padding:20px;grid-column:span 3">لا توجد بيانات</p>';
}

function renderAnalysis(done){
  if(!done.length){
    document.getElementById('anGrid').innerHTML='<p style="color:var(--muted);padding:20px;grid-column:span 2">لا توجد بيانات بعد</p>';
    return;
  }
  const ORDER=['gyro','color','dist','force'];
  document.getElementById('anGrid').innerHTML=ORDER.map(sid=>{
    const correct=done.filter(d=>{const sr=getSensorResults(d);return sr[sid]===true;}).length;
    const attempted=done.filter(d=>{const sr=getSensorResults(d);return sr[sid]!==undefined;}).length;
    const pct=attempted>0?Math.round(correct/attempted*100):0;
    const col=SENSOR_COLORS[sid];
    const c=pct>=70?'var(--green)':pct>=40?'var(--yellow)':'var(--red)';
    return `<div class="an-card" style="background:linear-gradient(135deg,rgba(${sid==='gyro'?'139,92,246':sid==='color'?'236,72,153':sid==='dist'?'6,182,212':'245,158,11'},.08),var(--card));border-color:${col}33">
      <h3><span style="font-size:1.4em">${SENSOR_EMOJIS[sid]}</span> <span style="color:${col}">${SENSOR_NAMES[sid]}</span></h3>
      <div class="an-stat"><div class="an-lbl">أجبن بشكل صحيح</div><div class="an-val" style="color:${c}">${correct} / ${attempted} (${pct}%)</div></div>
      <div class="an-bar"><div class="an-fill" style="width:${pct}%;background:${col}"></div></div>
      <div class="an-stat" style="margin-top:10px"><div class="an-lbl">لم يجبن بعد</div><div class="an-val">${done.length-attempted}</div></div>
    </div>`;
  }).join('');
}

function setF(mode,btn){
  fm=mode;
  document.querySelectorAll('.ftab').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  const done=Object.values(cache).filter(d=>d&&d.name);
  const names=done.map(d=>d.name);
  renderGrid(done,STUDENTS.filter(n=>!names.includes(n)));
}
function swTab(id,btn){
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('on'));
  document.querySelectorAll('.tc').forEach(t=>t.classList.remove('on'));
  btn.classList.add('on');
  document.getElementById('tc-'+id).classList.add('on');
}
async function resetAct(){
  if(!confirm('مسح جميع نتائج هذا النشاط؟'))return;
  try{await fetch(`${DB}/${PATH}.json`,{method:'DELETE'});cache={};render();alert('✅ تم المسح.');}
  catch(e){alert('❌ خطأ.');}
}

loadData();
setInterval(loadData,15000);
</script>
</body>
</html>
